<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BANKFLOW · БД</title><style>body{font:16px system-ui;margin:30px;color:#153b73;background:#f3f6fb}main{max-width:850px;margin:auto;background:white;padding:25px;border-radius:16px}input{font:inherit;padding:12px;width:90%;border:1px solid #b8cbe0;border-radius:8px}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}h1{color:#153b73}b{color:#ed6a22}</style><main><h1>BANKFLOW · Базы данных</h1><p>Учебная SQLite-база. Запустить <code>python backend/server.py</code> из корня комплекта и открыть http://127.0.0.1:8000.</p><input id="q" placeholder="Поиск: Орлова, Ростов..."><p id="count">Подключение…</p><div id="res"></div></main><script>const q=document.querySelector('#q'),r=document.querySelector('#res'),c=document.querySelector('#count');let serial=0;async function search(){let x=++serial;try{const z=await fetch('/api/clients?q='+encodeURIComponent(q.value));if(!z.ok)throw Error();const a=await z.json();if(x!==serial)return;c.textContent='Найдено: '+a.length;r.replaceChildren();const t=document.createElement('table'),h=t.insertRow();for(const v of ['ID','Имя','Сегмент','Город']){const cell=document.createElement('th');cell.textContent=v;h.append(cell)}for(const v of a){let row=t.insertRow();for(const x of [v.id,v.name,v.segment,v.city])row.insertCell().textContent=x}r.append(t)}catch{c.textContent='Запустите локальный Python-сервер';}}q.oninput=search;search();</script></html>
