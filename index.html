const FILES={"modules/01-databases/README.md":{"name":"README.md","subject":"db","mime":"text/markdown","encoding":"text","content":"# Базы данных — Блиновская Т. М.\nДемонстрация BANKFLOW: 60 клиентов, 15 сотрудников, 15 продуктов, 360 обращений. 4 связанные таблицы. Поиск, JOIN, GROUP BY, внешние ключи.\nЗапуск: из корня `python backend/server.py`, затем http://localhost:8000. SQLite создаётся автоматически. `database/schema.sql`, `database/seed.sql`, `modules/01-databases/queries.sql`. Для преподавателя: подтвердить СУБД, вариант, номера ЛР и курсовую. Данная демонстрация не заменяет Access и назначенный вариант.\nИсточник: Telegram 23.10.2026, письмо Блиновской — \n"},"modules/01-databases/demo.html":{"name":"demo.html","subject":"db","mime":"text/html","encoding":"text","content":"<!doctype html><html lang=\"ru\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>BANKFLOW · БД<\/title><style>body{font:16px system-ui;margin:30px;color:#153b73;background:#f3f6fb}main{max-width:850px;margin:auto;background:white;padding:25px;border-radius:16px}input{font:inherit;padding:12px;width:90%;border:1px solid #b8cbe0;border-radius:8px}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}h1{color:#153b73}b{color:#ed6a22}<\/style><main><h1>BANKFLOW · Базы данных<\/h1><p>Учебная SQLite-база. Запустить <code>python backend/server.py<\/code> из корня комплекта и открыть http://127.0.0.1:8000.<\/p><input id=\"q\" placeholder=\"Поиск: Орлова, Ростов...\"><p id=\"count\">Подключение…<\/p><div id=\"res\"><\/div><\/main><script>const q=document.querySelector('#q'),r=document.querySelector('#res'),c=document.querySelector('#count');let serial=0;async function search(){let x=++serial;try{const z=await fetch('/api/clients?q='+encodeURIComponent(q.value));if(!z.ok)throw Error();const a=await z.json();if(x!==serial)return;c.textContent='Найдено: '+a.length;r.replaceChildren();const t=document.createElement('table'),h=t.insertRow();for(const v of ['ID','Имя','Сегмент','Город']){const cell=document.createElement('th');cell.textContent=v;h.append(cell)}for(const v of a){let row=t.insertRow();for(const x of [v.id,v.name,v.segment,v.city])row.insertCell().textContent=x}r.append(t)}catch{c.textContent='Запустите локальный Python-сервер';}}q.oninput=search;search();<\/script><\/html>\n"},"modules/01-databases/queries.sql":{"name":"queries.sql","subject":"db","mime":"application/sql","encoding":"text","content":"-- Выполняется в SQLite; запросы также совместимы с MySQL после USE bankflow.\nSELECT * FROM clients WHERE name LIKE '%Орлова%' ORDER BY name;\nSELECT r.id,c.name,r.category,r.status FROM requests r JOIN clients c ON r.client_id=c.id ORDER BY r.id LIMIT 20;\nSELECT category,COUNT(*) AS total,ROUND(AVG(hours),2) AS avg_hours FROM requests GROUP BY category HAVING COUNT(*)>0 ORDER BY total DESC;\nSELECT e.name,COUNT(r.id) AS workload FROM employees e LEFT JOIN requests r ON r.employee_id=e.id GROUP BY e.id,e.name ORDER BY workload DESC;\n"},"modules/02-vmip/README.md":{"name":"README.md","subject":"vmip","mime":"text/markdown","encoding":"text","content":"# ВМИП — Колесникова О. В.\nДемонстрация расчёта вклада с ежемесячной капитализацией; не назначенная лабораторная. Уточнить оригинальное задание и язык.\n"},"modules/02-vmip/calculation.py":{"name":"calculation.py","subject":"vmip","mime":"text/x-python","encoding":"text","content":"\"\"\"Дополнительная демонстрация; ТЗ ВМИП не установлено.\"\"\"\ndef deposit(principal, annual_pct, months):\n    if principal < 0 or annual_pct < 0 or months < 0: raise ValueError('Неверные параметры')\n    return round(principal * (1 + annual_pct / 1200) ** months, 2)\nif __name__ == '__main__':\n    print(deposit(100000, 12, 12))\n"},"modules/03-iis/BANKFLOW_LR1.ipynb":{"name":"BANKFLOW_LR1.ipynb","subject":"iis","mime":"application/octet-stream","encoding":"text","content":"{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# ИИС — ЛР1. BANKFLOW\\n\",\n        \"Синтетические банковские обращения. Согласовать датасет. Цель: анализ типов, пропусков, распределений и очистка. Признаки: id (идентификатор), client_id/employee_id/product_id (ключи), category/status/priority (категории), date (дата), hours (время).\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"import json\\n\",\n        \"from pathlib import Path\\n\",\n        \"# В Colab загрузите requests_raw.csv через панель Файлы.\\n\",\n        \"raw = pd.read_csv('requests_raw.csv')\\n\",\n        \"print('Размер:', raw.shape, '\\\\nТипы:', raw.dtypes, '\\\\nПропуски:', raw.isna().sum())\\n\",\n        \"print(raw.describe(include='all').to_string())\\n\",\n        \"df = raw.drop_duplicates().copy()\\n\",\n        \"df['category'] = df['category'].str.strip().str.capitalize()\\n\",\n        \"# Предметное правило: время обработки должно находиться в диапазоне 0..72 ч.\\n\",\n        \"invalid = ~df['hours'].between(0,72) & df['hours'].notna()\\n\",\n        \"df.loc[invalid,'hours'] = float('nan')\\n\",\n        \"median = df['hours'].median()\\n\",\n        \"df['hours'] = df['hours'].fillna(median)\\n\",\n        \"assert df['id'].is_unique and df['hours'].between(0,72).all()\\n\",\n        \"print('После очистки:', df.shape, 'Медиана:', median)\\n\",\n        \"print(df.groupby('category')['hours'].agg(['count','mean','min','max']))\\n\",\n        \"out = Path('.')\\n\",\n        \"df.to_csv(out/'requests_clean.csv',index=False)\\n\",\n        \"fig, ax = plt.subplots(figsize=(8,4)); df.groupby('category')['hours'].mean().sort_values().plot.barh(ax=ax,color='#e86a24'); ax.set_xlabel('Часы'); ax.set_title('Среднее время по категории'); fig.tight_layout(); fig.savefig(out/'category_hours.png',dpi=150);plt.close(fig)\\n\",\n        \"fig, ax = plt.subplots(figsize=(8,4)); df['hours'].plot.hist(bins=16,ax=ax,color='#153b73'); ax.set_xlabel('Часы'); ax.set_title('Распределение времени');fig.tight_layout();fig.savefig(out/'hours_hist.png',dpi=150);plt.close(fig)\\n\",\n        \"fig, ax = plt.subplots(figsize=(8,4)); df.groupby('status')['hours'].mean().plot.bar(ax=ax,color='#e86a24');ax.set_ylabel('Часы');ax.set_title('Среднее время по статусу');fig.tight_layout();fig.savefig(out/'status_hours.png',dpi=150);plt.close(fig)\\n\"\n      ]\n    },\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"## Контрольные вопросы\\n\",\n        \"1. Инструменты: Python, Jupyter/Colab, библиотеки для табличных данных, визуализации, ML.\\n\",\n        \"2. pandas — таблицы, NumPy — массивы и вычисления, matplotlib — графики, scikit-learn — модели и оценка.\\n\",\n        \"3. Python распространён благодаря экосистеме, лаконичному синтаксису, воспроизводимым блокнотам и интеграциям.\\n\",\n        \"Вывод: после очистки ключи уникальны, время находится в допустимом диапазоне. Графики описывают синтетическую выборку, не позволяют делать выводы о реальном банке.\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"language\": \"python\",\n      \"name\": \"python3\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 5\n}"},"modules/03-iis/README.md":{"name":"README.md","subject":"iis","mime":"text/markdown","encoding":"text","content":"# ИИС — Гробер Т. А. / Гончаров Д. С.\nЛР1: подготовка датасета. Пример выполнен на искусственных данных; согласование уникальности и темы с преподавателем необходимо.\n1. `python -m pip install -r modules/03-iis/requirements.txt`\n2. `python modules/03-iis/analysis.py`\n3. Для Google Colab загрузить `BANKFLOW_LR1.ipynb` и `data/requests_raw.csv`, выполнить ячейки.\nСкриншоты выполнен N         NaN  180.000000      NaN      NaN\nПосле очистки: (360, 9) Медиана: 21.6\n                  count       mean  min   max\ncategory                                     \nВклады               72  19.366667  0.5  44.8\nИнвестиции           72  24.044444  0.7  44.6\nКарты                73  22.017808  1.0  43.6\nКредиты              71  24.359155  2.0  42.1\nЦифровые сервисы     72  22.122222  1.0  44.9\n"},"modules/03-iis/analysis.py":{"name":"analysis.py","subject":"iis","mime":"text/x-python","encoding":"text","content":"\"\"\"ИИС ЛР1: учебные синтетические данные. Тема требует согласования.\"\"\"\nfrom pathlib import Path\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport json\nROOT = Path(__file__).resolve().parents[2]\nraw = pd.read_csv(ROOT / 'data/requests_raw.csv')\nprint('Размер:', raw.shape, '\\nТипы:', raw.dtypes, '\\nПропуски:', raw.isna().sum())\nprint(raw.describe(include='all').to_string())\ndf = raw.drop_duplicates().copy()\ndf['category'] = df['category'].str.strip().str.capitalize()\n# Предметное правило: время обработки должно находиться в диапазоне 0..72 ч.\ninvalid = ~df['hours'].between(0,72) & df['hours'].notna()\ndf.loc[invalid,'hours'] = float('nan')\nmedian = df['hours'].median()\ndf['hours'] = df['hours'].fillna(median)\nassert df['id'].is_unique and df['hours'].between(0,72).all()\nprint('После очистки:', df.shape, 'Медиана:', median)\nprint(df.groupby('category')['hours'].agg(['count','mean','min','max']))\nout = ROOT / 'modules/03-iis'\ndf.to_csv(out/'requests_clean.csv',index=False)\nfig, ax = plt.subplots(figsize=(8,4)); df.groupby('category')['hours'].mean().sort_values().plot.barh(ax=ax,color='#e86a24'); ax.set_xlabel('Часы'); ax.set_title('Среднее время по категории'); fig.tight_layout(); fig.savefig(out/'category_hours.png',dpi=150);plt.close(fig)\nfig, ax = plt.subplots(figsize=(8,4)); df['hours'].plot.hist(bins=16,ax=ax,color='#153b73'); ax.set_xlabel('Часы'); ax.set_title('Распределение времени');fig.tight_layout();fig.savefig(out/'hours_hist.png',dpi=150);plt.close(fig)\nfig, ax = plt.subplots(figsize=(8,4)); df.groupby('status')['hours'].mean().plot.bar(ax=ax,color='#e86a24');ax.set_ylabel('Часы');ax.set_title('Среднее время по статусу');fig.tight_layout();fig.savefig(out/'status_hours.png',dpi=150);plt.close(fig)\n"},"modules/03-iis/category_hours.png":{"name":"category_hours.png","subject":"iis","mime":"image/png","encoding":"base64","content":"iVBORw0KGgoAAAANSUhEUgAABLAAAAJYCAYAAABy5h8aAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAXEgAAFxIBZ5/SUgAAcFFJREFUeJzt3Xd4FFX//vF700MCoYQWqhCKhKp0UEJHilSlWAgSkCJIVUQQBCxRQRBRDCBBEFQ6KKggBJEOD02UTqih1yQEEjK/P/hlv1mzaUA2A7xf17XXRWbOmfOZ3ck+5n7OnLEYhmEIAAAAAAAAMCmnrC4AAAAAAAAASA0BFgAAAAAAAEyNAAsAAAAAAACmRoAFAAAAAAAAUyPAAgAAAAAAgKkRYAEAAAAAAMDUCLAAAAAAAABgagRYAAAAAAAAMDUCLAAAAAAAAJgaARYAAAAAAABMjQALAAAAAAAApkaABQAAAAAAAFMjwAIAAAAAAICpEWABAAAAAADA1AiwAAAAAAAAYGoEWAAAAAAAADA1AiwAAAAAAACYGgEWAAAAAAAATI0ACwAAAAAAAKZGgAUAAAAAAABTI8ACAAAAAACAqRFgAQAAAAAAwNQIsAAAAAAAAGBqBFgAAAAAAAAwNQIsAADgEHfu3NFPP/2kV199VaVLl1bOnDnl5uamfPnyqW7dunrnnXf0999/Z3WZAAAAMCGLYRhGVhcBAAAebZs3b1bXrl118OBB6zZXV1dlz55dV69eVUJCgnV7u3btNG/ePLm5uWVFqQAAADAhZmABAIBMtXz5cgUGBurgwYPKkyePPvroIx08eFC3b9/WpUuXdPv2bW3btk3Dhg1Tjhw5tGjRIsXExGR12QAAADARZmABAIBMc+jQIVWtWlXXr19XuXLl9Ntvv6lw4cIptr98+bJee+01hYWFKWfOnI4rFAAAAKbGDCwAAJBpRowYoevXr8vDw0OLFy9ONbySpNy5c2vJkiXy8fGxbgsLC5PFYlHx4sUlSatWrdJzzz2nvHnzytPTUwEBARo3bpxiY2NTPfaNGzf08ccfq1atWsqdO7fc3d1VpEgRderUSZs2bUrzXEaPHi2LxZLqKzAw0G7fxP3h4eFpHj+lY0hSRESEBgwYoICAAHl7eytbtmwqW7as3nzzTZ04cSLV+m/fvq2vvvpK9evXl6+vr9zc3FSgQAG1bt1aK1euTPP8U2LvfXB2dpavr68aNGigsLAwm1tEE4WHh1vbS9L27dvVoUMHFSxYUB4eHvL399fQoUN19erVTDmvpPWOHTs2xXZnzpyRq6urtW1YWJjddjt37lTXrl1VsmRJeXp62n1fRo8eneq5/FdERESa11zSV1BQUIrHWrRokVq2bKn8+fPLzc1N+fPnV8uWLbV48eIM1ZRUUFBQquOOHDlSFotFnp6eWr16tc2+uLg4LVu2TD179lTVqlVVsGBB65p4TZs21bx582Tv/2cPDAzM0HuS0md24cIFjRgxQlWqVJGPj488PDxUokQJde/eXfv27bN7Pkmv2YyOFxsbq4kTJ6p27 ч обращения), client_id, employee_id, product_id (целые ключи), category (категория продукта), date (дата в ISO), hours (вещественное время обработки), status и priority (категориальные). Возможные задачи: анализ нагрузки, качества обработки и распределения времени. Прогнозирование — дальнейшее расширение, не требование ЛР1.\n\n## 2. Первичный анализ\nЗапущенный скрипт `analysis.py` выявил 1 пропуск времени, 1 дубликат, два значения вне выбранного учебного диапазона 0–72 ч (-4 и 180), несогласованную строку категории « карты ». До очистки минимум -4, максимум 180, медиана 21,65 ч. Полная сводка и типы в `analysis-results.txt`.\n\n## 3. Очистка\n1. `drop_duplicates()` — удалён повтор записи.\n2. `str.strip().str.capitalize()` — нормализация категории.\n3. Значения времени вне 0–72 признаны ошибочными по принятому учебному правилу и заменены на NaN.\n4. Пропуски заполнены медианой 21,6 ч, рассчитанной по допустимым данным.\n5. Проверены уникальность идентификаторов и диапазон времени. Получено 360 строк, 9 признаков, пропусков времени нет.\n\n## 4. Результаты\n| Категория | Число обращений | Среднее, ч |\n|---|---:|---:|\n| Вклады | 72 | 19,37 |\n| Инвестиции | 72 | 24,04 |\n| Карты | 73 | 22,02 |\n| Кредиты | 71 | 24,36 |\n| Цифровые сервисы | 72 | 22,12 |\n\nРисунки: `category_hours.png`, `hours_hist.png`, `status_hours.png` — построены фактическим запуском Python. В Notebook выполнить ячейки в Google Colab и приложить реальные скриншоты к финальному отчёту. Исходный код `analysis.py`, блокнот `BANKFLOW_LR1.ipynb`, исходная выборка `data/requests_raw.csv`, очищенная `requests_clean.csv`.\n\n## 5. Контрольные вопросы\n1. Инструменты Data Science: Python, Jupyter/Colab, среды разработки, библиотеки анализа и визуализации, системы управления версиями.\n2. pandas — табличные структуры и обработка; NumPy — векторные вычисления; matplotlib — визуализация; scikit-learn — алгоритмы машинного обучения и оценка моделей.\n3. Python популярен благодаря лаконичному синтаксису, экосистеме библиотек, воспроизводимым блокнотам и интеграции с другими инструментами.\n\n## Вывод\nПолучена очищенная синтетическая выборка, пригодная для дальнейшего анализа. Числа характеризуют только учебные данные, а не реальный банк. Итоговый комплект требует согласования датасета и скриншотов работы в Colab.\n"},"modules/03-iis/requests_clean.csv":{"name":"requests_clean.csv","subject":"iis","mime":"text/csv","encoding":"text","content":"id,client_id,employee_id,product_id,category,date,hours,status,priority\n1,1,1,1,Карты,2026-06-01,1.0,Закрыто,Высокий\n2,2,8,4,Инвестиции,2026-06-02,5.5,Закрыто,Обычный\n3,3,15,7,Вклады,2026-06-03,18.0,Закрыто,Обычный\n4,4,7,10,Цифровые сервисы,2026-06-04,30.9,В работе,Обычный\n5,5,14,13,Кредиты,2026-06-05,21.6,Новое,Высокий\n6,6,6,1,Карты,2026-06-06,5.5,Закрыто,Обычный\n7,7,13,4,Инвестиции,2026-06-07,10.8,Закрыто,Обычный\n8,8,5,7,Вклады,2026-06-08,34.2,Закрыто,Обычный\n9,9,12,10,Цифровые сервисы,2026-06-09,7.1,Новое,Высокий\n10,10,4,13,Кредиты,2026-06-10,33.5,В работе,Обычный\n11,11,11,1,Карты,2026-06-11,30.0,Закрыто,Обычный\n12,12,3,4,Инвестиции,2026-06-12,6.6,Закрыто,Обычный\n13,13,10,7,Вклады,2026-06-13,24.3,Закрыто,Высокий\n14,14,2,10,Цифровые сервисы,2026-06-14,20.4,В работе,Обычный\n15,15,9,13,Кредиты,2026-06-15,18.9,Новое,Обычный\n16,16,1,2,Вклады,2026-06-16,44.8,Закрыто,Обычный\n17,17,8,5,Цифровые сервисы,2026-06-17,4.6,Закрыто,Высокий\n18,18,15,8,Кредиты,2026-06-18,21.6,Закрыто,Обычный\n19,19,7,11,Карты,2026-06-19,42.3,Новое,Обычный\n20,20,14,14,Инвестиции,2026-06-20,18.4,В работе,Обычный\n21,21,6,2,Вклады,2026-06-21,9.3,Закрыто,Высокий\n22,22,13,5,Цифровые сервисы,2026-06-22,15.2,Закрыто,Обычный\n23,23,5,8,Кредиты,2026-06-23,16.7,Закрыто,Обычный\n24,24,12,11,Карты,2026-06-24,43.0,В работе,Обычный\n25,25,4,14,Инвестиции,2026-06-25,9.9,Новое,Высокий\n26,26,11,2,Вклады,2026-06-26,10.2,Закрыто,Обычный\n27,27,3,5,Цифровые сервисы,2026-06-27,26.5,Закрыто,Обычный\n28,28,10,8,Кредиты,2026-06-28,24.9,Закрыто,Обычный\n29,29,2, LAAAAABKmgALAAAAgJImwAIAAACgpAmwAAAAAChpAiwAAAAASpoACwAAAICSJsACAAAAoKQJsAAAAAAoaQIsAAAAAEra/wNsWTSizwvjiAAAAABJRU5ErkJggg=="},"modules/04-isit/README.md":{"name":"README.md","subject":"isit","mime":"text/markdown","encoding":"text","content":"# ИСиТ — Барашко Е. Н.\nНайдены ЛР1–3 и контрольная №1. ЛР1: MySQL пользователи и права; ЛР2: сотрудники; ЛР3: запросы. Скрипты 1 и 2 — рабочие проекты, 3 — все 19 основных заданий по исходной методичке, плюс пример удаления. MySQL 8 необходим; SQLite и браузерная имитация не доказывают выполнение MySQL. Контрольная: минимум 3 таблицы и 15 строк в каждой; вариант по последней цифре зачётки. Вариант 1 «Банк» — в текущей демонстрации, не назначен студенту. Требуются реальные скриншоты, титул, автоматическое оглавление, 10 источников и печатный отчёт (методичка 2023). Срок и полный допуск уточнить. Источник: архив ИСиТ от 29.09.2026, сообщение 15 в теме БД.\n\nЛР3: `lab03_queries.sql` теперь содержит все 19 основных запросов по формулировкам исходного 3_MySQL.pdf, включая исправление опечатки в примере LIKE (кириллическая К), и дополнительный безопасный пример DELETE. Проверить выполнение на MySQL 8, а не только визуальную модель. Для ЛР1 запускать части от разных пользователей как указано в комментариях.\n"},"modules/04-isit/lab01_access.sql":{"name":"lab01_access.sql","subject":"isit","mime":"application/sql","encoding":"text","content":"-- MySQL 8, учебный локальный сервер. Не запускать на рабочем банковском сервере.\n-- Шаг 1: администратор. Уникальные имена, тестовые пароли меняйте при необходимости.\nCREATE DATABASE IF NOT EXISTS test;\nCREATE USER 'bf_admin'@'localhost' IDENTIFIED BY 'DemoOnly_A31!';\nGRANT CREATE USER ON *.* TO 'bf_admin'@'localhost';\nGRANT ALL PRIVILEGES ON test.* TO 'bf_admin'@'localhost' WITH GRANT OPTION;\n-- Шаг 2: войти как bf_admin, выполнить следующие команды отдельно.\nCREATE USER 'bf_reader'@'localhost' IDENTIFIED BY 'DemoOnly_R31!';\nCREATE USER 'bf_operator'@'localhost' IDENTIFIED BY 'DemoOnly_O31!';\nGRANT ALL PRIVILEGES ON test.* TO 'bf_reader'@'localhost';\nGRANT ALL PRIVILEGES ON test.* TO 'bf_operator'@'localhost';\nREVOKE INSERT ON test.* FROM 'bf_operator'@'localhost';\nRENAME USER 'bf_operator'@'localhost' TO 'RenamedUser'@'localhost';\nSHOW GRANTS FOR 'bf_reader'@'localhost';\nSHOW GRANTS FOR 'RenamedUser'@'localhost';\n-- Сделать скриншоты фактического исполнения; далее очистка.\nREVOKE ALL PRIVILEGES, GRANT OPTION FROM 'bf_reader'@'localhost', 'RenamedUser'@'localhost';\nDROP USER 'bf_reader'@'localhost', 'RenamedUser'@'localhost';\n-- Шаг 3: снова администратор, удалить созданную учебную учётную запись.\nDROP USER 'bf_admin'@'localhost';\n"},"modules/04-isit/lab02_employees.sql":{"name":"lab02_employees.sql","subject":"isit","mime":"application/sql","encoding":"text","content":"CREATE DATABASE IF NOT EXISTS bankflow_lab2;\nUSE bankflow_lab2;\nDROP TABLE IF EXISTS employee_lab;\nCREATE TABLE employee_lab(id INT PRIMARY KEY AUTO_INCREMENT, first_name VARCHAR(50), last_name VARCHAR(50));\nINSERT INTO employee_lab(first_name,last_name) VALUES ('Anna','Orlova'),('Ivan','Belov'),('Maria','Kuznetsova'),('Pavel','Krylov');\nALTER TABLE employee_lab ADD age INT, ADD position VARCHAR(50), ADD experience INT, ADD salary DECIMAL(10,2);\nUPDATE employee_lab SET age=25+id, position='Manager', experience=id, salary=50000+id*2500 WHERE id BETWEEN 1 AND 4;\nUPDATE employee_lab SET position='Senior Manager',salary=72000 WHERE id IN (1,3);\nSELECT * FROM employee_lab ORDER BY id;\n"},"modules/04-isit/lab03_queries.sql":{"name":"lab03_queries.sql","subject":"isit","mime":"application/sql","encoding":"text","content":"-- ИСиТ, ЛР3. Все 19 основных пунктов из 3_MySQL.pdf (9+5+4+1).\n-- MySQL 8; выполнять только на учебном сервере. Не использовать реальную БД банка.\n-- Блок 1, п.1\nCREATE DATABASE IF NOT EXISTS addressbook CHARACTER SET utf8mb4;\nUSE addressbook;\n-- Подготовка учебной таблицы по схеме ЛР2. Удаление только в выделенной тестовой БД.\nDROP TABLE IF EXISTS employee_data;\nCREATE TABLE employee_data (\n emp_id INT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,\n f_name VARCHAR(20), l_name VARCHAR(20), title VARCHAR(30), age INT,\n yos INT, salary INT, perks INT, email VARCHAR(60)\n);\n-- Синтетические записи для проверки всех условий.\nINSERT INTO employee_data(f_name,l_name,title,age,yos,salary,perks,email) VALUES\n ('Иван','Иванов','стажер',25,1,35000,5000,'ivan@example.test'),\n ('Карина','Куценко','клинер',40,2,25000,4000,'karina@example.test'),\n ('Серафим','Майборода','программист',32,5,95000,17000,'serafim@example.test'),\n ('Василий','Тёркин','Web-разработчик',51,3,100000,11000,'web@example.test'),\n ('Елизавета','Бурундук','бухгалтер',63,38,82000,11000,'account@example.test'),\n ('Оксана','Климова','продавец',35,7,110000,18000,'sales@example.test');\n-- 1.2: сведения о структуре таблицы\nDESCRIBE employee_data;\n-- 1.3: перечень доступных БД\nSHOW DATABASES;\n-- 1.4: запись по заданию (учебные данные из методички)\nINSERT INTO employee_data(f_name,l_name,title,age,yos,salary,perks,email)\nVALUES ('Рудольф','Курочкин','программист',34,2,95000,17000,'rudolf@yandex.ru');\n-- 1.5: два способа вывести все поля\nSELECT emp_id,f_name,l_name,title,age,yos,salary,perks,email FROM employee_data;\nSELECT * FROM employee_data;\n-- 1.6\nSELECT f_name,email FROM employee_data;\n-- 1.7\nSELECT salary,perks,yos FROM employee_data;\n-- 1.8\nSELECT COUNT(*) AS row_count FROM employee_data;\n-- 1.9\nSELECT salary,l_name FROM employee_data;\n-- Блок 2: WHERE\nSELECT emp_id FROM employee_data WHERE age>30; -- 2.1\nSELECT f_name,l_name FROM employee_data WHERE title='Web-разработчик'; -- 2.2\nSELECT * FROM employee_data WHERE salary<=100000; -- 2.3: зарплата <=100000\nSELECT salary,perks FROM employee_data WHERE perks>16000; -- 2.4\nSELECT l_name,f_name FROM employee_data WHERE title='бухгалтер'; -- 2.5\n-- Блок 3: LIKE (К — кириллическая буква, исправлена опечатка в примере пособия)\nSELECT f_name,l_name FROM employee_data WHERE l_name LIKE 'К%'; -- 3.1\nSELECT f_name,l_name FROM employee_data WHERE title LIKE '%продавец%'; -- 3.2\nSELECT f_name,l_name,salary FROM employee_data WHERE f_name LIKE '%к%'; -- 3.3\nSELECT l_name,title FROM employee_data WHERE title LIKE '%программист%'; -- 3.4\n-- Блок 4: средний возраст в группах по должности выше 30\nSELECT title,AVG(age) AS avg_age FROM employee_data GROUP BY title HAVING AVG(age)>30;\n-- Дополнительный пример удаления из методички: безопасный тест на отдельной записи.\nSTART TRANSACTION;\nINSERT INTO employee_data(f_name,l_name,title,age,yos,salary,perks,email) VALUES ('Василий','Пупкин','мультимедиа',25,2,50000,5000,'demo@example.test');\nSET @delete_id=LAST_INSERT_ID();\nDELETE FROM employee_data WHERE emp_id=@delete_id;\nROLLBACK;\n"},"modules/04-isit/mysql_bankflow.sql":{"name":"mysql_bankflow.sql","subject":"isit","mime":"application/sql","encoding":"text","content":"-- MySQL 8; только учебная отдельная база.\nCREATE DATABASE IF NOT EXISTS bankflow CHARACTER SET utf8mb4;\nUSE bankflow;\nDROP TABLE IF EXISTS requests;\nDROP TABLE IF EXISTS products;\nDROP TABLE IF EXISTS employees;\nDROP TABLE IF EXISTS clients;\nCREATE TABLE clients(id INT PRIMARY KEY, name VARCHAR(120) NOT NULL, segment VARCHAR(30), city VARCHAR(80));\nCREATE TABLE employees(id INT PRIMARY KEY, name VARCHAR(120), role VARCHAR(50), age INT, experience INT, salary INT);\nCREATE TABLE products(id INT PRIMARY KEY, name VARCHAR(120), category VARCHAR(60));\nCREATE TABLE requests(id INT PRIMARY KEY, client_id INT NOT NULL, employee_id INT NOT NULL, product_id INT NOT NULL, category VARCHAR(60), date DATE, hours DECIMAL(6,1), status VARCHAR(30), priority VARCHAR(30), FOREIGN KEY(client_id) REFERENCES clients(id), FOREIGN KEY(employee_id) REFERENCES employees(id), FOREIGN KEY(product_id) REFERENCES products(id));\nINSERT INTO clients (id,name,segment,city) VALUES\n(1,'Анна Орлова','Стандарт','Ростов-на-Дону'),\n(2,'Михаил Соколов','Премиум','Краснодар'),\n(3,'Елена Волко 200 V160 M400 120 H600 V160\" stroke=\"#31598b\" fill=\"none\" stroke-width=\"2\"/><rect x=\"250\" y=\"20\" width=\"300\" height=\"65\" rx=\"10\" fill=\"#fff0e5\" stroke=\"#31598b\"/><text x=\"400.0\" y=\"45\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"400.0\" dy=\"0\">Руководитель<\/tspan><tspan x=\"400.0\" dy=\"20\">подразделения<\/tspan><\/text><rect x=\"45\" y=\"160\" width=\"310\" height=\"70\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"200.0\" y=\"185\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"200.0\" dy=\"0\">Группа обслуживания<\/tspan><tspan x=\"200.0\" dy=\"20\">8 менеджеров<\/tspan><\/text><rect x=\"445\" y=\"160\" width=\"310\" height=\"70\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"600.0\" y=\"185\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"600.0\" dy=\"0\">Группа обработки<\/tspan><tspan x=\"600.0\" dy=\"20\">7 специалистов<\/tspan><\/text><\/svg>"},"modules/05-design/project.md":{"name":"project.md","subject":"design","mime":"text/markdown","encoding":"text","content":"# Проектирование ИС — BANKFLOW\nСтупина М. В. / Барашко Е. Н. · ДГТУ, ВОЗПИ-31\n\n**Статус:** учебный проект, тема подлежит согласованию; реальные скриншоты аналогов добавить.\n\n## Введение\nВымышленное банковское подразделение принимает обращения клиентов по картам, вкладам, кредитам, инвестициям и цифровым сервисам. Цель — единый реестр, сокращение ручного поиска, контроль нагрузки и сроков. Система не проводит банковские операции и не использует реальные персональные данные.\n\n## 1. Анализ предметной области\nВ условном подразделении 1 руководитель, 8 менеджеров и 7 специалистов. Численность выбрана для учебной модели, а не описывает реальный банк. Учет обращений до внедрения ведется в разрозненных списках. Задачи: сократить повторный ввод, устранить потерю назначений, получить сопоставимые показатели сроков.\n\n## 1.1 Сравнительный анализ программных продуктов (ЛР1)\nСравнение по 5 критериям, по публичной документации, не по результатам самостоятельного тестирования.\n\n| Критерий | Jira Service Management | GLPI | Zammad | BANKFLOW (цель) |\n|---|---|---|---|---|\n| Регистрация обращений | Портал, email, API | Инциденты и запросы | Helpdesk, tickets | Ввод заявки |\n| Назначение | Очереди, исполнители | Группы и ответственные | Маршрутизация командам | Ответственный сотрудник |\n| Контроль процесса | Workflow, SLA | Статус, приоритет | Чек-листы, история | Статус, время |\n| Аналитика | Отчёты и метрики | Dashboards, статистика | Отчётность (сверить редакцию) | Группировка и графики |\n| Область применения | ITSM, сервисные команды | ITSM, активы | Поддержка клиентов | Учебный банковский реестр |\n\nИсточники: https://support.atlassian.com/jira-service-management-cloud/docs/get-to-know-the-main-jira-service-management-features/ ; https://www.glpi-project.org/en/features/ ; https://zammad.com/en/product/features . Скриншоты оригинальных интерфейсов и проверка актуальных редакций — обязательный оставшийся шаг для ЛР1.\n\nФункции: поиск клиентов, учёт продуктов, регистрация обращений, распределение задач, аналитика. Ограничения: только учебные данные, локальная демонстрация, нет финансовых транзакций, нет промышленной авторизации.\n\n## 1.2 Структура организации (ЛР2)\nОрганизационная схема до внедрения: руководитель подразделения → две параллельные группы: обслуживание (8 менеджеров) и обработка (7 специалистов). В исходной схеме нет ещё не существующей ИС или IT-отдела. До внедрения данные хранятся в отдельных списках, обращения передаются вручную. После внедрения — единый реестр.\n\n![Организационная структура до внедрения](org-before.svg)\n\n| Сотрудник | Функции до внедрения | Функции, которые автоматизируются |\n|---|---|---|\n| Менеджер | Поиск клиента, запись заявки, передача | Поиск по реестру, создание заявки, выбор продукта и исполнителя |\n| Специалист | Получение задания, фиксация результата | Просмотр очереди, фильтрация, изменение статуса |\n| Руководитель | Сбор сведений из списков | Сводные показатели, контроль нагрузки и сроков |\n\n### 1.2.1 Функциональные подсистемы\n**Таблица 2. Оперативный уровень**\n\n| Подсистема | Вход | Функция | Выход |\n|---|---|---|---|\n| Клиентский реестр | Идентификатор, имя, город | Поиск и фильтр | Карточка клиента |\n| Обращения | Клиент, продукт, исполнитель, приоритет | Регистрация и смена статуса | Запись обращения |\n| Справочники | Идентификатор продукта или сотрудника | Выбор существующей записи | Ссылка на справочник |\n\n**Таблица 3. Тактический уровень**\n\n| Подсистема | Вход | Функция | Выход |\n|---|---|---|---|\n| Очередь | Реестр обращений | Фильтр по статусу, контроль исполнения | Список задач |\n| Распределение | Сотрудники, новые обращения | Назначение ответственного при регистрации | Очередь сотрудника |\n| Контроль | Даты, статусы, приоритет | Выявление незакрытых и срочных заявок | Сводка для руководителя |\n\n**Таблица 4. Стратегический уровень**\n\n| Подсистема | Вход | Функция | Выход |\n|---|---|---|---|\n| Аналитика | Учебный набор обращений | Статистика и группировка по категориям | Графики и показатели |\n| Планирование | Сводка нагрузки и длительности | Оценка потребности в ресурсах | Решения о распределении нагрузки |\n| Качество | Результаты проверок | Контроль выполнения требований | Протокол и план улучшений |\n\nЧасть тактических и стратегических функций является проектным требованием; фактическая реализация и ограничения приведены в разделе 2.4.\n\n### 1.2.2 Обеспечивающие подсистемы\n![Карта обеспечивающих подсистем](support-map.svg)\n\n| Вид обеспечения | Назначение в BANKFLOW |\n|---|---|\n| Информационное | Таблицы, связи, синтетические данные, словарь полей |\n| Программное | Браузер, Python/SQLite, отдельные MySQL/Node-модули |\n| Техническое | ПК с Python, планшет с браузером, доверенная сеть |\n| Технологическое | Регламент регистрации, назначение, обработка, закрытие заявки |\n| Математическое | Фильтрация, агрегаты, статистика длительности |\n| Организационное | Роли, ответственность, инструкции, порядок передачи |\n| Юридическое | Запрет реальных банковских данных; независимый учебный прототип |\n| Лингвистическое | Русский интерфейс, единые термины, справочники статусов |\n\n## 2. Техническое задание (ЛР3)\n### 2.1 Общие сведения\nНазвание: BANKFLOW; заказчик и исполнитель — учебные роли.\n### 2.2 Назначение и цели\nЕдиный демонстрационный интерфейс, семь дисциплин, реестр обращений и анализ.\n### 2.3 Объект автоматизации\nРабота с обращениями условного подразделения; роли менеджера, специалиста, руководителя.\n### 2.4 Требования\nФункциональные требования: F1 — поиск и фильтрация клиентов; F2 — регистрация обращения по существующим клиенту, продукту и сотруднику; F3 — изменение статуса и фильтр реестра; F4 — экспорт реестра в CSV; F5 — анализ фиксированного учебного датасета. Нефункциональные: N1 — автономная демонстрация, N2 — адаптивный интерфейс, N3 — проверка связей и допустимых значений на сервере, N4 — только синтетические данные. Веб-демо хранит изменения в браузере; локальный режим пишет в SQLite. Аналитика ИИС использует отдельный фиксированный снимок для воспроизводимости. Прогнозирование и промышленная авторизация вне объема прототипа.\n### 2.5 Состав работ\nАнализ, модель данных, интерфейс, API, тестирование, отчёты.\n### 2.6 Контроль и приёмка\nКритерии приемки: 7 разделов открываются; поиск по имени возвращает совпадения; заявка получает уникальный ID и статус «Новое»; смена статуса сохраняется после обновления; неизвестный внешний ключ отклоняется; CSV содержит выбранные записи; исходный датасет очищается до 360 уникальных строк; автономная демонстрация открывается без сети после кэширования. MySQL и Express проверяются отдельно в своих средах. Результаты тестов и ограничения — tests/verification.txt.\n### 2.7 Подготовка объекта\nУстановить Python для серверного режима, MySQL для ИСиТ, Node.js для Express; подготовить демонстрационные данные.\n### 2.8 Документирование\nREADME, исходники, схема данных, отдельные комплекты и отчёты.\n### 2.9 Источники\nМетодические указания ЛР1–3, Telegram 14.10.2026; официальная документация аналогов выше.\n"},"modules/05-design/support-map.svg":{"name":"support-map.svg","subject":"design","mime":"image/svg+xml","encoding":"text","content":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"800\" height=\"320\" viewBox=\"0 0 800 320\"><rect width=\"100%\" height=\"100%\" fill=\"#fff\"/><path d=\"M400 156 L260 44\" stroke=\"#adc2dc\" fill=\"none\"/><rect x=\"20\" y=\"20\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"140.0\" y=\"45\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"140.0\" dy=\"0\">Информационное<\/tspan><\/text><path d=\"M400 156 L260 118\" stroke=\"#adc2dc\" fill=\"none\"/><rect x=\"20\" y=\"94\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"140.0\" y=\"119\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"140.0\" dy=\"0\">Программное<\/tspan><\/text><path d=\"M400 156 L260 192\" stroke=\"#adc2dc\" fill=\"none\"/><rect x=\"20\" y=\"168\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"140.0\" y=\"193\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"140.0\" dy=\"0\">Техническое<\/tspan><\/text><path d=\"M400 156 L260 266\" stroke=\"#adc2dc\" fill=\"none\"/><rect x=\"20\" y=\"242\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"140.0\" y=\"267\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"140.0\" dy=\"0\">Технологическое<\/tspan><\/text><path d=\"M400 156 L540 44\" stroke=\"#adc2dc\" fill=\"none\"/><rect x=\"540\" y=\"20\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"660.0\" y=\"45\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"660.0\" dy=\"0\">Математическое<\/tspan><\/text><path d=\"M400 156 L540 118\" stroke=\"#adc2dc\" fill=\"none\"/><rect x=\"540\" y=\"94\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"660.0\" y=\"119\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"660.0\" dy=\"0\">Организационное<\/tspan><\/text><path d=\"M400 156 L540 192\" stroke=\"#adc2dc\" fill=\"none\"/><rect x=\"540\" y=\"168\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"660.0\" y=\"193\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"660.0\" dy=\"0\">Юридическое<\/tspan><\/text><path d=\"M400 156 L540 266\" stroke=\"#adc2dc\" fill=\"none\"/><rect x=\"540\" y=\"242\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#eaf1fb\" stroke=\"#31598b\"/><text x=\"660.0\" y=\"267\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"660.0\" dy=\"0\">Лингвистическое<\/tspan><\/text><rect x=\"310\" y=\"126\" width=\"180\" height=\"60\" rx=\"10\" fill=\"#fff0e5\" stroke=\"#31598b\"/><text x=\"400.0\" y=\"151\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#142e58\"><tspan x=\"400.0\" dy=\"0\">BANKFLOW<\/tspan><\/text><\/svg>"},"modules/06-server/README.md":{"name":"README.md","subject":"server","mime":"text/markdown","encoding":"text","content":"# Серверные интернет-технологии\nЛР1–6: найдено 45 основных пунктов плюс дополнительное задание; exercises.js содержит интерактивные примеры; lab-solutions.js — 45 основных решений и 2 дополнительных упражнения по найденным формулировкам. ЛР3 пункт 1 реализован отдельным примером (исходный приложенный HTML не проверен); правила оформления сверить. ЛР9: отдельный пример Express (заголовок, картинка, подпись), запуск `npm install` и `npm start` в этой папке, открыть http://127.0.0.1:3000. ЛР8/10 — материалы Node/C++ Winsock, обязательный объём не установлен; №7 не найден. Источник: Telegram 21.10.2026 \n\nОткройте `labs.html` в браузере: самостоятельная демонстрационная страница всех 45 основных пунктов + 2 дополнительных, код и результат. Для ЛР1 и ЛР5 предусмотрены prompt/alert. В ЛР3 часы обновляются ежесекундно. Вторая функция бисекции не имеет корня на [0,1] (нижняя оценка 0.5). Приложенный исходный HTML для ЛР3 п.1 не проверялся; реализован самостоятельный эквивалент. Сдача полного семестра не подтверждена.\n"},"modules/06-server/exercises.js":{"name":"exercises.js","subject":"server","mime":"text/javascript","encoding":"text","content":"// BANKFLOW · демонстрационные упражнения по материалам ЛР1–6.\n// Это примеры, а не полное решение всех 45 пунктов.\nfunction palindrome(s){const a=s.toLowerCase().replace(/[^\\p{L}\\p{N}]/gu,'');return a===[...a].reverse().join('');}\nfunction triangle(a,b,c){if(Math.min(a,b,c)<=0||a+b<=c||a+c<=b||b+c<=a)throw Error('Некорректные стороны');const p=(a+b+c)/2;return Math.sqrt(p*(p-a)*(p-b)*(p-c));}\nfunction primes(n){return Array.from({length:Math.max(0,n-1)},(_,i)=>i+2).filter(x=>{for(let j=2;j*j<=x;j++)if(x%j===0)return false;return true;});}\nfunction bisect(f,a,b,eps=0.001){if(!Number.isFinite(a+b+eps)||eps<=0||a>=b||f(a)*f(b)>0)throw Error('Нет интервала смены знака');if(f(a)===0)return a;if(f(b)===0)return b;for(let i=0;i<100&&(b-a)>eps;i++){const m=(a+b)/2;if(f(m)===0)return m;if(f(a)*f(m)<=0)b=m;else a=m;}return(a+b)/2;}\nfunction deepCopy(o){return JSON.parse(JSON.stringify(o));}\nclass Calculator{constructor(x=0){this.x=x;} add(y){this.x+=y;return this;} multiply(y){this.x*=y;return this;}}\nfunction anagram(a,b){const f=s=>[...s.toLowerCase().replace(/\\s/g,'')].sort().join('');return f(a)===f(b);}\nfunction pairSum(a,t){const seen=new Set();for(const n of a){if(seen.has(t-n))return [t-n,n];seen.add(n);}return null;}\nconst exercises={palindrome,triangle,primes,bisect,deepCopy,Calculator,anagram,pairSum};\nif(typeof module!=='undefined')module.exports=exercises;\n"},"modules/06-server/lab-solutions.js":{"name":"lab-solutions.js","subject":"server","mime":"text/javascript","encoding":"text","content":"// СИТ · Гончаров Д. С. · ЛР 1–6: отдельные решения по найденным формулировкам.\n// Задание ЛР1 просит alert/prompt: для него предусмотрен отдельный интерактивный запуск.\n// ЛР3: №4 в оригинале встречается дважды; 4а — бисекция, 4б — часы.\nconst JS_LABS=[\n{n:1,title:'Числа, строки и условия',tasks:[\n['1','Деление на ноль',()=>{let x=10,y=15,z=0;return x+y/z;}],\n['2','Сложение строк и числа',()=>{let s1='123',s2='456',s3='name',n=123;return [s1+s2,n+s2,n+s3,'Оператор + при строковом операнде выполняет конкатенацию'];}],\n['3','Шаблонная строка',()=>{let num1=123,num2=456;return `Результат = ${num1+num2}`;}],\n['4','Проверка палиндромов',()=>{let poly='abcdedcba',test='teststring';const check=s=>s===[...s].reverse().join('');return [poly,check(poly),test,check(test)];}],\n['5','Максимум трёх чисел',()=>{let a=10,b=17,c=5;return Math.max(a,b,c);}],\n['6','Площадь треугольника',()=>{const area=(a,b,c)=>{if(Math.min(a,b,c)<=0||a+b<=c||a+c<=b||b+c<=a)return 'Треугольник не существует';let p=(a+b+c)/2;return Math.sqrt(p*(p-a)*(p-b)*(p-c));};return [[5,6,7,area(5,6,7)],[10,12,25,area(10,12,25)]];}],\n['7','Оператор switch',()=>{const f=n=>{switch(n){case 1:return 'Равно 1';case 2:return 'Равно 2';case 3:return 'Равно 3';default:return 'Не равно 1, 2, 3';}};return [1,2,3,9].map(f);}],\n['8','Дни недели',()=>{const days=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];const day=n=>Number.isInteger(n)&&n>=1&&n<=7?days[n-1]:'Неверный номер';return [1,5,7,9].map(day);}],\n['9','Оператор ??',()=>{let v=null;return [v??'по умолчанию',0??42,false??true];}],\n['Доп.','Регулярное выражение URL',()=>{const re=/^https?:\\/\\/(?:[\\w-]+\\.)+[a-z]{2,}(?::\\d{1,5})?(?:[/?#][^\\s]*)?$/i;return ['https://example.com/path','http://localhost','bad url'].map(x=>[x,re.test(x)]);}],\n]},\n{n:2,title:'Массивы, типы, даты',tasks:[\n['1','Делимость на три двумя способами',()=>{const n=123456789;return {remainder:n%3,digitSum:[...String(n)].reduce((s,x)=>s+Number(x),0),divisible:n%3===0,digitCheck:[...String(n)].reduce((s,x)=>s+Number(x),0)%3===0};}],\n['2','Типы данных',()=>{let test_function=(a,b)=>a+b;return [null,5,'teststring',[1,2,'str1'],test_function].map(x=>[x===null?'null':Array.isArray(x)?'array':String(x),typeof x]);}],\n['3','Инверсия регистра',()=>{const s='A1b2C3d4E5g6H';return [s,[...s].map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('')];}],\n['4','Сумма числовых элементов',()=>{const a=[2,'name',4.5,'str1','str2',9,['true','false'],0.5],b=['name','str1','str2',['true','false']];const sum=a=>a.filter(x=>typeof x==='number'&&Number.isFinite(x)).reduce((s,x)=>s+x,0);return [sum(a),sum(b)];}],\n['5','Простые числа 1–100',()=>{const isPrime=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;};return Array.from({length:100},(_,i)=>i+1).filter(isPrime);}],\n['6','Сортировка массивов',()=>{const a=[32,7,90,-4,15,900,64],b=['HTML','RUBY','CSS','Python','C++'];return [a.sort((a,b)=>a-b),b.sort((a,b)=>a.localeCompare(b,'en'))];}],\n['7','День недели через 5 и 177 дней',()=>{const f=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('ru-RU',{weekday:'long',year:'numeric',month:'2-digit',day:'2-digit'});};return [f(5),f(177)];}],\n['Доп.','URL — повторение ЛР1',()=>{const re=/^https?:\\/\\/(?:[\\w-]+\\.)+[a-z]{2,}(?::\\d{1,5})?(?:[/?#][^\\s]*)?$/i;return ['https://example.org','not-a-url'].map(x=>[x,re.test(x)]);}],\n]},\n{n:3,title:'Функции, HTML, объекты',tasks:[\n['1','Десятичная запятая',()=>{const parse=s=>Number(s.trim().replace(',','.'));return ['3,14',parse('3,14'),'2.5',parse('2.5')];}],\n['2','Тригонометрическая таблица',()=>{return [0,15,30,45,60,75,90].map(x=>{let r=x*Math.PI/180;return {x,sin:+Math.sin(r).toFixed(6),cos:+Math.cos(r).toFixed(6),tg:x===90?'не определён':+Math.tan(r).toFixed(6)};});}],\n['3','Двоичное число',()=>{const binary=s=>{if(!/^[01]+$/.test(s))throw Error('Не двоичное число');return [...s].reduce((a,b)=>a*2+Number(b),0);};return ['110011','111'].map(x=>[x,binary(x)]);}],\n['4а','Метод бисекции',()=>{const bisect=(f,a,b,eps)=>{if(f(a)*f(b)>0)return 'Нет смены знака';if(f(a)===0)return a;if(f(b)===0)return b;while(b-a>eps){let m=(a+b)/2;if(f(m)===0)return m;if(f(a)*f(m)<=0)b=m;else a=m;}return (a+b)/2;};return [bisect(x=>x*x-Math.cos(x),0,1,.001),bisect(x=>x**4+1.5-Math.sin(x),0,1,.001),'Вторая функция ≥ 0.5: корней на [0,1] нет.'];}],\n['4б','Часы HH:MM:SS',()=>{const now=new Date(),p=x=>String(x).padStart(2,'0');return [p(now.getHours()),p(now.getMinutes()),p(now.getSeconds())].join(':');}],\n['5','Поиск Bob в массиве объектов',()=>{let user=[{name:'John',age:30},{name:'Bob',age:21},{name:'Anna',age:19}];let bob=user.find(x=>x.name==='Bob');return bob;}],\n['6','Ключи и значения объекта',()=>{let an_obj={100:'a',2:'b',7:'c'};return {keys:Object.keys(an_obj),values:Object.values(an_obj)};}],\n['7','Логарифмы и удаление нечисловых свойств',()=>{let menu={width:200,height:300,title:'My menu'};const logs=o=>{for(const [k,v] of Object.entries(o))if(typeof v==='number'&&v>0)o['log_'+k]=Math.log10(v);return o;};const nums=o=>{for(const k of Object.keys(o))if(typeof o[k]!=='number')delete o[k];return o;};return nums(logs(menu));}],\n]},\n{n:4,title:'Объекты и ссылки',tasks:[\n['1','Список свойств студента',()=>{let student={name:'David',last_name:'Smirnoff',year:3,average_mark:95};return Object.keys(student);}],\n['2','Ссылки user/admin/director',()=>{let user={name:'David',job:'manager',salary:50000};let admin=user;admin.name='Alex';let a=user.name;user=null;let b=admin.name;let director=admin;director.salary+=1000;director.job='boss';let c={...admin};admin=null;director=null;let d;try{d=director.job}catch(e){d=e.name};return {afterRename:a,afterUserNull:b,sharedObject:c,afterDirectorNull:d};}],\n['3','Удвоить числовые свойства',()=>{const multNum=o=>{for(const k of Object.keys(o))if(typeof o[k]==='number')o[k]*=2;return o;};return multNum({width:200,height:300,depth:250,title:'My cube'});}],\n['4','Общие свойства с одинаковыми значениями',()=>{const a={a:1,b:2,c:3,d:4,e:5,str1:'name',str2:'Peter'},b={z:1,w:2,c:3,d:4,e:5,str1:'family',str2:'Peter'};return Object.fromEntries(Object.entries(a).filter(([k,v])=>Object.hasOwn(b,k)&&b[k]===v));}],\n['5','Объект → пары ключ/значение',()=>{let o={name:'Ann',age:22,city:'Rostov'};return Object.entries(o);}],\n['6','Обмен ключей и значений',()=>{let o={name:'Ann',age:22,city:'Rostov'};return Object.fromEntries(Object.entries(o).map(([k,v])=>[String(v),k]));}],\n['7','Найти jQuery',()=>{let o={js:['jQuery','Angular'],php:'hello',css:'world'};let jq=o.js.find(x=>x==='jQuery');return jq;}],\n['8','Глубокая копия объекта',()=>{let obj2={city:'Rostov'},obj1={name:'Ann',inner_obj:obj2};let obj3=structuredClone(obj1);obj3.inner_obj.city='Krasnodar';return {obj1,obj3};}],\n]},\n{n:5,title:'Конструкторы, методы, this',tasks:[\n['1','Конструктор с параметром по умолчанию',()=>{function Person(name,age,profession='unknown'){this.name=name;this.age=age;this.profession=profession;}return [new Person('Ann',21),new Person('Bob',30,NaN),new Person('Tom',25,false)].map(p=>({...p,profession:String(p.profession)}));}],\n['2','Калькулятор с пятью методами',()=>{let calculator={read(a,b){if(!Number.isFinite(a)||!Number.isFinite(b))throw Error('Нужны числа');this.a=a;this.b=b;return this;},sum(){return this.a+this.b;},mul(){return this.a*this.b;},substr(){return this.a-this.b;},div(){if(this.a===0)throw Error('Деление на ноль');return this.b/this.a;}};calculator.read(5,10);return {sum:calculator.sum(),mul:calculator.mul(),substr:calculator.substr(),div:calculator.div()};}],\n['3','Три книги',()=>{function Book(title,price){this.title=title;this.price=price;this.show=function(){return `${this.title}: ${this.price}`;};}return [new Book('JS',500),new Book('SQL',700),new Book('Python',900)].map(b=>b.show());}],\n['4','Лестница с цепочкой вызовов',()=>{let out=[];let ladder={step:0,up(){this.step++;return this;},down(){this.step=Math.max(0,this.step-1);return this;},showStep(){out.push(this.step);return this;}};ladder.up().up().down().showStep().down().showStep().down().showStep();return out;}],\n['5','this обычной и стрелочной функции',()=>{const call={caller:'mom',says:function(){return `Hey, ${this.caller} just called.`;}};function makeArrow(){return {caller:'mom',says:()=>`Hey, ${this.caller} just called.`};}const arrow=makeArrow.call({caller:'outer'});return [call.says(),arrow.says(),'Стрелка наследует this из внешней функции, а не из объекта call.'];}],\n['6','Symbol и for…in',()=>{const unique=Symbol('unique');let user={name:'Ann',age:25,profession:'manager',salary:50000,[unique]:123};let values=[];for(let k in user)values.push(user[k]);return {values,symbolValue:user[unique],explanation:'for...in не перечисляет Symbol'};}],\n]},\n{n:6,title:'Symbol, Map, Set',tasks:[\n['1','Пять ключей, включая Symbol',()=>{let a=Symbol('a'),b=Symbol('b'),o={name:'Ann',age:22,city:'Rostov',[a]:1,[b]:2};return {keys:Object.keys(o),json:JSON.stringify(o),reflect:Reflect.ownKeys(o).map(String)};}],\n['2','Map с массивами в ключах',()=>{let a=[1,2],b=[3,4],m=new Map([[a,'first'],[b,'second']]);return {entries:[...m],getSameReference:m.get(a),getNewArray:m.get([1,2])??'undefined'};}],\n['3','Map с объектом → Object.fromEntries',()=>{let key={id:1},m=new Map([[key,'client'],['name','Ann']]);return Object.fromEntries(m);}],\n['4','Топ-5 языков',()=>{let a=[{Swahili:4},{Arabic:25},{Russian:9},{English:91},{Portuguese:9},{Dutch:8},{German:7},{French:45},{Chinese:5},{Spanish:24},{Serbian:4}];return a.flatMap(Object.entries).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).slice(0,5);}],\n['5','Уникальные строки',()=>{let a=['card','loan','card','deposit','loan','deposit'];return [...new Set(a)];}],\n['6','Очистка массива от анаграмм',()=>{const aclean=a=>{let m=new Map();for(const s of a)m.set([...s.toLowerCase()].sort().join(''),s);return [...m.values()];};return aclean(['сон','нос','ток','кот','кто','дом','мод']);}],\n['7','Пара с заданной суммой',()=>{const hasPair=(a,sum)=>{let seen=new Set();for(const x of a){if(seen.has(sum-x))return true;seen.add(x);}return false;};return [hasPair([2,7,11,15],9),hasPair([1,3,6,8],14+2)];}],\n]}\n];\nfunction displayResult(v){if(typeof v==='number'&&!Number.isFinite(v))return String(v);if(typeof v==='string')return v;return JSON.stringify(v,null,2)}\nfunction runPromptLab1(){alert('Задание 1: '+(10+15/0));const vals=[];for(const k of ['a','b','c']){const raw=prompt('Сторона '+k,'5');if(raw===null)return;vals.push(Number(raw));}const [a,b,c]=vals;if(!vals.every(Number.isFinite)||Math.min(...vals)<=0||a+b<=c||a+c<=b||b+c<=a){alert('Треугольник не существует');return;}let p=(a+b+c)/2;alert('Площадь: '+Math.sqrt(p*(p-a)*(p-b)*(p-c)));}\nfunction runPromptLab5(){const a=prompt('Первое число','5'),b=prompt('Второе число','10');if(a===null||b===null)return;const calculator={read(a,b){if(!a.trim()||!b.trim()||!Number.isFinite(+a)||!Number.isFinite(+b))throw Error('Нужны числа');this.a=+a;this.b=+b;return this;},sum(){return this.a+this.b;},mul(){return this.a*this.b;},substr(){return this.a-this.b;},div(){return this.a===0?'Деление на ноль':this.b/this.a;}};try{calculator.read(a,b);alert('Сумма: '+calculator.sum()+'; произведение: '+calculator.mul()+'; разность: '+calculator.substr()+'; частное: '+calculator.div());}catch(e){alert(e.message)}}\nif(typeof module!=='undefined')module.exports={JS_LABS,displayResult};\n"},"modules/06-server/labs.html":{"name":"labs.html","subject":"server","mime":"text/html","encoding":"text","content":"<!doctype html><html lang=\"ru\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>BANKFLOW — СИТ ЛР1–6<\/title><style>body{font:15px system-ui;background:#f2f5fa;color:#142e58;margin:0}main{max-width:1000px;margin:auto;padding:25px}section{background:white;border-radius:15px;padding:20px;margin:12px 0}button{font:inherit;background:#f36b21;color:white;border:0;padding:8px 13px;border-radius:8px;cursor:pointer}pre{background:#142e58;color:white;padding:13px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}select{font:inherit;padding:10px}article{padding:10px 0;border-bottom:1px solid #ddd}<\/style><main><h1>BANKFLOW · Серверные интернет-технологии<\/h1><p>Гончаров Д. С. · 45 основных пунктов и дополнительные упражнения. Нажмите на задание, чтобы выполнить JavaScript.<\/p><select id=\"select\"><\/select><section id=\"result\"><\/section><p>ЛР3 №4 повторяется, обозначен 4а/4б. Исходный приложенный HTML ЛР3 требует сверки; №7/8/10 и оформление — уточнить.<\/p><\/main><script>// СИТ · Гончаров Д. С. · ЛР 1–6: отдельные решения по найденным формулировкам.\n// Задание ЛР1 просит alert/prompt: для него предусмотрен отдельный интерактивный запуск.\n// ЛР3: №4 в оригинале встречается дважды; 4а — бисекция, 4б — часы.\nconst JS_LABS=[\n{n:1,title:'Числа, строки и условия',tasks:[\n['1','Деление на ноль',()=>{let x=10,y=15,z=0;return x+y/z;}],\n['2','Сложение строк и числа',()=>{let s1='123',s2='456',s3='name',n=123;return [s1+s2,n+s2,n+s3,'Оператор + при строковом операнде выполняет конкатенацию'];}],\n['3','Шаблонная строка',()=>{let num1=123,num2=456;return `Результат = ${num1+num2}`;}],\n['4','Проверка палиндромов',()=>{let poly='abcdedcba',test='teststring';const check=s=>s===[...s].reverse().join('');return [poly,check(poly),test,check(test)];}],\n['5','Максимум трёх чисел',()=>{let a=10,b=17,c=5;return Math.max(a,b,c);}],\n['6','Площадь треугольника',()=>{const area=(a,b,c)=>{if(Math.min(a,b,c)<=0||a+b<=c||a+c<=b||b+c<=a)return 'Треугольник не существует';let p=(a+b+c)/2;return Math.sqrt(p*(p-a)*(p-b)*(p-c));};return [[5,6,7,area(5,6,7)],[10,12,25,area(10,12,25)]];}],\n['7','Оператор switch',()=>{const f=n=>{switch(n){case 1:return 'Равно 1';case 2:return 'Равно 2';case 3:return 'Равно 3';default:return 'Не равно 1, 2, 3';}};return [1,2,3,9].map(f);}],\n['8','Дни недели',()=>{const days=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];const day=n=>Number.isInteger(n)&&n>=1&&n<=7?days[n-1]:'Неверный номер';return [1,5,7,9].map(day);}],\n['9','Оператор ??',()=>{let v=null;return [v??'по умолчанию',0??42,false??true];}],\n['Доп.','Регулярное выражение URL',()=>{const re=/^https?:\\/\\/(?:[\\w-]+\\.)+[a-z]{2,}(?::\\d{1,5})?(?:[/?#][^\\s]*)?$/i;return ['https://example.com/path','http://localhost','bad url'].map(x=>[x,re.test(x)]);}],\n]},\n{n:2,title:'Массивы, типы, даты',tasks:[\n['1','Делимость на три двумя способами',()=>{const n=123456789;return {remainder:n%3,digitSum:[...String(n)].reduce((s,x)=>s+Number(x),0),divisible:n%3===0,digitCheck:[...String(n)].reduce((s,x)=>s+Number(x),0)%3===0};}],\n['2','Типы данных',()=>{let test_function=(a,b)=>a+b;return [null,5,'teststring',[1,2,'str1'],test_function].map(x=>[x===null?'null':Array.isArray(x)?'array':String(x),typeof x]);}],\n['3','Инверсия регистра',()=>{const s='A1b2C3d4E5g6H';return [s,[...s].map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('')];}],\n['4','Сумма числовых элементов',()=>{const a=[2,'name',4.5,'str1','str2',9,['true','false'],0.5],b=['name','str1','str2',['true','false']];const sum=a=>a.filter(x=>typeof x==='number'&&Number.isFinite(x)).reduce((s,x)=>s+x,0);return [sum(a),sum(b)];}],\n['5','Простые числа 1–100',()=>{const isPrime=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;};return Array.from({length:100},(_,i)=>i+1).filter(isPrime);}],\n['6','Сортировка массивов',()=>{const a=[32,7,90,-4,15,900,64],b=['HTML','RUBY','CSS','Python','C++'];return [a.sort((a,b)=>a-b),b.sort((a,b)=>a.localeCompare(b,'en'))];}],\n['7','День недели через 5 и 177 дней',()=>{const f=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('ru-RU',{weekday:'long',year:'numeric',month:'2-digit',day:'2-digit'});};return [f(5),f(177)];}],\n['Доп.','URL — повторение ЛР1',()=>{const re=/^https?:\\/\\/(?:[\\w-]+\\.)+[a-z]{2,}(?::\\d{1,5})?(?:[/?#][^\\s]*)?$/i;return ['https://example.org','not-a-url'].map(x=>[x,re.test(x)]);}],\n]},\n{n:3,title:'Функции, HTML, объекты',tasks:[\n['1','Десятичная запятая',()=>{const parse=s=>Number(s.trim().replace(',','.'));return ['3,14',parse('3,14'),'2.5',parse('2.5')];}],\n['2','Тригонометрическая таблица',()=>{return [0,15,30,45,60,75,90].map(x=>{let r=x*Math.PI/180;return {x,sin:+Math.sin(r).toFixed(6),cos:+Math.cos(r).toFixed(6),tg:x===90?'не определён':+Math.tan(r).toFixed(6)};});}],\n['3','Двоичное число',()=>{const binary=s=>{if(!/^[01]+$/.test(s))throw Error('Не двоичное число');return [...s].reduce((a,b)=>a*2+Number(b),0);};return ['110011','111'].map(x=>[x,binary(x)]);}],\n['4а','Метод бисекции',()=>{const bisect=(f,a,b,eps)=>{if(f(a)*f(b)>0)return 'Нет смены знака';if(f(a)===0)return a;if(f(b)===0)return b;while(b-a>eps){let m=(a+b)/2;if(f(m)===0)return m;if(f(a)*f(m)<=0)b=m;else a=m;}return (a+b)/2;};return [bisect(x=>x*x-Math.cos(x),0,1,.001),bisect(x=>x**4+1.5-Math.sin(x),0,1,.001),'Вторая функция ≥ 0.5: корней на [0,1] нет.'];}],\n['4б','Часы HH:MM:SS',()=>{const now=new Date(),p=x=>String(x).padStart(2,'0');return [p(now.getHours()),p(now.getMinutes()),p(now.getSeconds())].join(':');}],\n['5','Поиск Bob в массиве объектов',()=>{let user=[{name:'John',age:30},{name:'Bob',age:21},{name:'Anna',age:19}];let bob=user.find(x=>x.name==='Bob');return bob;}],\n['6','Ключи и значения объекта',()=>{let an_obj={100:'a',2:'b',7:'c'};return {keys:Object.keys(an_obj),values:Object.values(an_obj)};}],\n['7','Логарифмы и удаление нечисловых свойств',()=>{let menu={width:200,height:300,title:'My menu'};const logs=o=>{for(const [k,v] of Object.entries(o))if(typeof v==='number'&&v>0)o['log_'+k]=Math.log10(v);return o;};const nums=o=>{for(const k of Object.keys(o))if(typeof o[k]!=='number')delete o[k];return o;};return nums(logs(menu));}],\n]},\n{n:4,title:'Объекты и ссылки',tasks:[\n['1','Список свойств студента',()=>{let student={name:'David',last_name:'Smirnoff',year:3,average_mark:95};return Object.keys(student);}],\n['2','Ссылки user/admin/director',()=>{let user={name:'David',job:'manager',salary:50000};let admin=user;admin.name='Alex';let a=user.name;user=null;let b=admin.name;let director=admin;director.salary+=1000;director.job='boss';let c={...admin};admin=null;director=null;let d;try{d=director.job}catch(e){d=e.name};return {afterRename:a,afterUserNull:b,sharedObject:c,afterDirectorNull:d};}],\n['3','Удвоить числовые свойства',()=>{const multNum=o=>{for(const k of Object.keys(o))if(typeof o[k]==='number')o[k]*=2;return o;};return multNum({width:200,height:300,depth:250,title:'My cube'});}],\n['4','Общие свойства с одинаковыми значениями',()=>{const a={a:1,b:2,c:3,d:4,e:5,str1:'name',str2:'Peter'},b={z:1,w:2,c:3,d:4,e:5,str1:'family',str2:'Peter'};return Object.fromEntries(Object.entries(a).filter(([k,v])=>Object.hasOwn(b,k)&&b[k]===v));}],\n['5','Объект → пары ключ/значение',()=>{let o={name:'Ann',age:22,city:'Rostov'};return Object.entries(o);}],\n['6','Обмен ключей и значений',()=>{let o={name:'Ann',age:22,city:'Rostov'};return Object.fromEntries(Object.entries(o).map(([k,v])=>[String(v),k]));}],\n['7','Найти jQuery',()=>{let o={js:['jQuery','Angular'],php:'hello',css:'world'};let jq=o.js.find(x=>x==='jQuery');return jq;}],\n['8','Глубокая копия объекта',()=>{let obj2={city:'Rostov'},obj1={name:'Ann',inner_obj:obj2};let obj3=structuredClone(obj1);obj3.inner_obj.city='Krasnodar';return {obj1,obj3};}],\n]},\n{n:5,title:'Конструкторы, методы, this',tasks:[\n['1','Конструктор с параметром по умолчанию',()=>{function Person(name,age,profession='unknown'){this.name=name;this.age=age;this.profession=profession;}return [new Person('Ann',21),new Person('Bob',30,NaN),new Person('Tom',25,false)].map(p=>({...p,profession:String(p.profession)}));}],\n['2','Калькулятор с пятью методами',()=>{let calculator={read(a,b){if(!Number.isFinite(a)||!Number.isFinite(b))throw Error('Нужны числа');this.a=a;this.b=b;return this;},sum(){return this.a+this.b;},mul(){return this.a*this.b;},substr(){return this.a-this.b;},div(){if(this.a===0)throw Error('Деление на ноль');return this.b/this.a;}};calculator.read(5,10);return {sum:calculator.sum(),mul:calculator.mul(),substr:calculator.substr(),div:calculator.div()};}],\n['3','Три книги',()=>{function Book(title,price){this.title=title;this.price=price;this.show=function(){return `${this.title}: ${this.price}`;};}return [new Book('JS',500),new Book('SQL',700),new Book('Python',900)].map(b=>b.show());}],\n['4','Лестница с цепочкой вызовов',()=>{let out=[];let ladder={step:0,up(){this.step++;return this;},down(){this.step=Math.max(0,this.step-1);return this;},showStep(){out.push(this.step);return this;}};ladder.up().up().down().showStep().down().showStep().down().showStep();return out;}],\n['5','this обычной и стрелочной функции',()=>{const call={caller:'mom',says:function(){return `Hey, ${this.caller} just called.`;}};function makeArrow(){return {caller:'mom',says:()=>`Hey, ${this.caller} just called.`};}const arrow=makeArrow.call({caller:'outer'});return [call.says(),arrow.says(),'Стрелка наследует this из внешней функции, а не из объекта call.'];}],\n['6','Symbol и for…in',()=>{const unique=Symbol('unique');let user={name:'Ann',age:25,profession:'manager',salary:50000,[unique]:123};let values=[];for(let k in user)values.push(user[k]);return {values,symbolValue:user[unique],explanation:'for...in не перечисляет Symbol'};}],\n]},\n{n:6,title:'Symbol, Map, Set',tasks:[\n['1','Пять ключей, включая Symbol',()=>{let a=Symbol('a'),b=Symbol('b'),o={name:'Ann',age:22,city:'Rostov',[a]:1,[b]:2};return {keys:Object.keys(o),json:JSON.stringify(o),reflect:Reflect.ownKeys(o).map(String)};}],\n['2','Map с массивами в ключах',()=>{let a=[1,2],b=[3,4],m=new Map([[a,'first'],[b,'second']]);return {entries:[...m],getSameReference:m.get(a),getNewArray:m.get([1,2])??'undefined'};}],\n['3','Map с объектом → Object.fromEntries',()=>{let key={id:1},m=new Map([[key,'client'],['name','Ann']]);return Object.fromEntries(m);}],\n['4','Топ-5 языков',()=>{let a=[{Swahili:4},{Arabic:25},{Russian:9},{English:91},{Portuguese:9},{Dutch:8},{German:7},{French:45},{Chinese:5},{Spanish:24},{Serbian:4}];return a.flatMap(Object.entries).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).slice(0,5);}],\n['5','Уникальные строки',()=>{let a=['card','loan','card','deposit','loan','deposit'];return [...new Set(a)];}],\n['6','Очистка массива от анаграмм',()=>{const aclean=a=>{let m=new Map();for(const s of a)m.set([...s.toLowerCase()].sort().join(''),s);return [...m.values()];};return aclean(['сон','нос','ток','кот','кто','дом','мод']);}],\n['7','Пара с заданной суммой',()=>{const hasPair=(a,sum)=>{let seen=new Set();for(const x of a){if(seen.has(sum-x))return true;seen.add(x);}return false;};return [hasPair([2,7,11,15],9),hasPair([1,3,6,8],14+2)];}],\n]}\n];\nfunction displayResult(v){if(typeof v==='number'&&!Number.isFinite(v))return String(v);if(typeof v==='string')return v;return JSON.stringify(v,null,2)}\nfunction runPromptLab1(){alert('Задание 1: '+(10+15/0));const vals=[];for(const k of ['a','b','c']){const raw=prompt('Сторона '+k,'5');if(raw===null)return;vals.push(Number(raw));}const [a,b,c]=vals;if(!vals.every(Number.isFinite)||Math.min(...vals)<=0||a+b<=c||a+c<=b||b+c<=a){alert('Треугольник не существует');return;}let p=(a+b+c)/2;alert('Площадь: '+Math.sqrt(p*(p-a)*(p-b)*(p-c)));}\nfunction runPromptLab5(){const a=prompt('Первое число','5'),b=prompt('Второе число','10');if(a===null||b===null)return;const calculator={read(a,b){if(!a.trim()||!b.trim()||!Number.isFinite(+a)||!Number.isFinite(+b))throw Error('Нужны числа');this.a=+a;this.b=+b;return this;},sum(){return this.a+this.b;},mul(){return this.a*this.b;},substr(){return this.a-this.b;},div(){return this.a===0?'Деление на ноль':this.b/this.a;}};try{calculator.read(a,b);alert('Сумма: '+calculator.sum()+'; произведение: '+calculator.mul()+'; разность: '+calculator.substr()+'; частное: '+calculator.div());}catch(e){alert(e.message)}}\nif(typeof module!=='undefined')module.exports={JS_LABS,displayResult};\n\nconst sel=document.querySelector('#select'),r=document.querySelector('#result');JS_LABS.forEach(l=>{let o=document.createElement('option');o.value=l.n;o.textContent='ЛР'+l.n+' — '+l.title;sel.append(o)});function render(){let l=JS_LABS.find(x=>x.n==sel.value);r.replaceChildren();let timer;for(let t of l.tasks){let a=document.createElement('article'),h=document.createElement('h3'),b=document.createElement('button'),c=document.createElement('button'),pre=document.createElement('pre');h.textContent=t[0]+'. '+t[1];b.textContent='Выполнить';c.textContent='Код';c.style.marginLeft='8px';pre.hidden=true;a.append(h,b,c,pre);r.append(a);b.onclick=()=>{pre.hidden=false;pre.textContent=displayResult(t[2]());if(l.n===3&&t[0]==='4б'){clearInterval(timer);timer=setInterval(()=>{if(!pre.isConnected){clearInterval(timer);return}pre.textContent=t[2]()},1000)}};c.onclick=()=>{pre.hidden=false;pre.textContent=t[2].toString()}}if(l.n===1||l.n===5){let b=document.createElement('button');b.textContent='Запустить prompt / alert';b.onclick=l.n===1?runPromptLab1:runPromptLab5;r.append(b)}}sel.onchange=render;render();<\/script><\/html>"},"modules/06-server/package.json":{"name":"package.json","subject":"server","mime":"application/json","encoding":"text","content":"{\n  \"name\": \"bankflow-express-lab9\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"scripts\": {\n    \"start\": \"node server.js\"\n  },\n  \"dependencies\": {\n    \"express\": \"^4.21.2\"\n  }\n}"},"modules/06-server/server.js":{"name":"server.js","subject":"server","mime":"text/javascript","encoding":"text","content":"const express=require('express');\nconst path=require('path');\nconst app=express();\napp.get('/',(req,res)=>res.send(`<!DOCTYPE html><html lang=\"ru\"><meta charset=\"utf-8\"><title>BANKFLOW · Express<\/title><style>body{font:20px system-ui;background:#eef3fa;padding:40px;color:#123469}figure{margin:0}img{width:320px;max-width:100%}<\/style><h1>BANKFLOW — сервер Express<\/h1><figure><img src=\"/logo.svg\" alt=\"Учебный знак BANKFLOW\"><figcaption>Учебная система банковских обращений<\/figcaption><\/figure><\/html>`));\napp.get('/logo.svg',(req,res)=>res.type('image/svg+xml').send('<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 120\"><rect width=\"320\" height=\"120\" rx=\"20\" fill=\"#153b73\"/><path d=\"M36 80L62 34H86L60 80Z\" fill=\"#ff7424\"/><text x=\"105\" y=\"73\" font-family=\"Arial\" font-size=\"25\" font-weight=\"bold\" fill=\"white\">BANKFLOW<\/text><\/svg>'));\napp.get('/api/health',(req,res)=>res.json({status:'ok',lab:'Express 9'}));\napp.listen(3000,'127.0.0.1',()=>console.log('http://127.0.0.1:3000'));\n"},"modules/07-standards/engineering.md":{"name":"engineering.md","subject":"std","mime":"text/markdown","encoding":"text","content":"# Разработка и стандартизация — Каныгин Г. И.\nBANKFLOW · проектный пример; вариант разработки ПО согласовать.\n## ЛР1.1–1.3: планирование по таблице 1.4\nВ методичке Каныгина 2026 предусмотрены 17 этапов. Исходный 7-этапный укрупнённый план заменён на подробный. `schedule17.csv` содержит все этапы, длительность, исполнителя, начало, конец, предшественников и резерв. `schedule.py` рассчитывает прямой и обратный проход CPM; общий срок 25 рабочих дней. Два критических пути: 1–2–3–4–5–6–8–9–10–11–12–13–14–16–17 и через 7 вместо 6. Работа 15 выполняется после 8 и до 16; резерв определяется расчётом. Длительности и зависимости — проектные допущения, не фактический календарь.\n\nВ интерфейсе: Гант по 17 этапам, оперограмма с четырьмя ролями, сетевой график и таблица ES/EF/LS/LF. Тема BANKFLOW не входит в 16 вариантов таблицы 1.3 — требуется согласование или перенос плана на назначенную тему. Номер 3 в списке студентов не доказывает вариант 3.\n\n## ЛР1.4: ТЗ\nВ проекте `modules/05-design/project.md` — черновик ТЗ. Требуется адаптировать под отдельную методичку Каныгина и назначенный вариант.\n## ЛР2.1–2.3: надёжность\nМодели Шумана, простая интуитивная, Мусса — расчёты выполнять по назначенному варианту и таблицам методички. Тестовый чек-лист не заменяет эти расчёты.\n## ЛР3: стандарты\nСопоставить требования методички с ГОСТ 19.201-78 (ТЗ на программу), ГОСТ 19.301-79 (программа и методика испытаний), ГОСТ 34.602-2020 (ТЗ на автоматизированную систему) только в применимых частях. Проверить перечень стандартов, заданный преподавателем.\n## Контроль\nРеальные результаты автоматических проверок — `tests/verification.txt` после запуска.\n"},"modules/07-standards/plan.csv":{"name":"plan.csv","subject":"std","mime":"text/csv","encoding":"text","content":"﻿№;Работа;Исполнитель;Длительность;Предшественники;Начало (день);Конец (день);Позднее начало;Поздний конец;Резерв\r\n1;Постановка задачи;Аналитик;1;;1;1;1;1;0\r\n2;Сбор исходных данных;Аналитик;2;1;2;3;2;3;0\r\n3;Анализ существующих методов и программных средств;Аналитик;2;2;4;5;4;5;0\r\n4;Обоснование необходимости разработки;Аналитик;1;3;6;6;6;6;0\r\n5;Определение и анализ требований;Аналитик;2;4;7;8;7;8;0\r\n6;Структура входных и выходных данных;Аналитик;1;5;9;9;9;9;0\r\n7;Выбор технических и программных средств;Разработчик;1;5;9;9;9;9;0\r\n8;Согласование и утверждение технического задания;Руководитель;1;6,7;10;10;10;10;0\r\n9;Проектирование программной архитектуры;Разработчик;2;8;11;12;11;12;0\r\n10;Техническое проектирование компонентов;Разработчик;2;9;13;14;13;14;0\r\n11;Программирование модулей;Разработчик;4;10;15;18;15;18;0\r\n12;Тестирование программных модулей;Тестировщик;2;11;19;20;19;20;0\r\n13;Сборка и испытание программы;Тестировщик;1;12;21;21;21;21;0\r\n14;Анализ результатов испытаний;Тестировщик;1;13;22;22;22;22;0\r\n15;Расчёты показателей безопасности жизнедеятельности;Аналитик;1;8;11;11;22;22;11\r\n16;Экономические расчёты;Аналитик;1;14,15;23;23;23;23;0\r\n17;Оформление пояснительной записки;Аналитик;2;16;24;25;24;25;0\r\n"},"modules/07-standards/schedule.py":{"name":"schedule.py","subject":"std","mime":"text/x-python","encoding":"text","content":"\"\"\"Учебный план по таблице 1.4 методички Каныгина; тема BANKFLOW условная.\nДлительности и зависимости — проектные допущения. Не заменяет назначенный вариант.\n\"\"\"\nimport csv\nfrom pathlib import Path\nTASKS=[\n('Постановка задачи','Аналитик',1,[]),\n('Сбор исходных данных','Аналитик',2,[1]),\n('Анализ существующих методов и программных средств','Аналитик',2,[2]),\n('Обоснование необходимости разработки','Аналитик',1,[3]),\n('Определение и анализ требований','Аналитик',2,[4]),\n('Структура входных и выходных данных','Аналитик',1,[5]),\n('Выбор технических и программных средств','Разработчик',1,[5]),\n('Согласование и утверждение технического задания','Руководитель',1,[6,7]),\n('Проектирование программной архитектуры','Разработчик',2,[8]),\n('Техническое проектирование компонентов','Разработчик',2,[9]),\n('Программирование модулей','Разработчик',4,[10]),\n('Тестирование программных модулей','Тестировщик',2,[11]),\n('Сборка и испытание программы','Тестировщик',1,[12]),\n('Анализ результатов испытаний','Тестировщик',1,[13]),\n('Расчёты показателей безопасности жизнедеятельности','Аналитик',1,[8]),\n('Экономические расчёты','Аналитик',1,[14,15]),\n('Оформление пояснительной записки','Аналитик',2,[16]),\n]\ndef calculate(tasks=TASKS):\n    rows=[]\n    for i,(name,role,dur,deps) in enumerate(tasks,1):\n        start=max([rows[d-1]['ef'] for d in deps],default=0)\n        rows.append(dict(id=i,name=name,role=role,dur=dur,deps=deps,es=start,ef=start+dur))\n    finish=max(r['ef'] for r in rows)\n    for r in reversed(rows):\n        successors=[x for x in rows if r['id'] in x['deps']]\n        r['lf']=min([x['ls'] for x in successors],default=finish);r['ls']=r['lf']-r['dur'];r['slack']=r['ls']-r['es']\n    return rows,finish\ndef write_csv():\n    rows,finish=calculate();out=Path(__file__).with_name('schedule17.csv')\n    with out.open('w',encoding='utf-8-sig',newline='') as f:\n        w=csv.writer(f,delimiter=';');w.writerow(['№','Работа','Исполнитель','Длительность','Предшественники','Начало (день)','Конец (день)','Позднее начало','Поздний конец','Резерв'])\n        for r in rows:w.writerow([r['id'],r['name'],r['role'],r['dur'],','.join(map(str,r['deps'])),r['es']+1,r['ef'],r['ls']+1,r['lf'],r['slack']])\n    out.with_name('plan.csv').write_bytes(out.read_bytes())\n    return rows,finish\nif __name__=='__main__':\n    rows,finish=write_csv()\n    print('Длительность:',finish,'дней. Критические работы:',[r['id'] for r in rows if r['slack']==0]);assert len(rows)==17 and all(r['slack']>=0 for r in rows)\n"},"modules/07-standards/schedule17.csv":{"name":"schedule17.csv","subject":"std","mime":"text/csv","encoding":"text","content":"﻿№;Работа;Исполнитель;Длительность;Предшественники;Начало (день);Конец (день);Позднее начало;Поздний конец;Резерв\r\n1;Постановка задачи;Аналитик;1;;1;1;1;1;0\r\n2;Сбор исходных данных;Аналитик;2;1;2;3;2;3;0\r\n3;Анализ существующих методов и программных средств;Аналитик;2;2;4;5;4;5;0\r\n4;Обоснование необходимости разработки;Аналитик;1;3;6;6;6;6;0\r\n5;Определение и анализ требований;Аналитик;2;4;7;8;7;8;0\r\n6;Структура входных и выходных данных;Аналитик;1;5;9;9;9;9;0\r\n7;Выбор технических и программных средств;Разработчик;1;5;9;9;9;9;0\r\n8;Согласование и утверждение технического задания;Руководитель;1;6,7;10;10;10;10;0\r\n9;Проектирование программной архитектуры;Разработчик;2;8;11;12;11;12;0\r\n10;Техническое проектирование компонентов;Разработчик;2;9;13;14;13;14;0\r\n11;Программирование модулей;Разработчик;4;10;15;18;15;18;0\r\n12;Тестирование программных модулей;Тестировщик;2;11;19;20;19;20;0\r\n13;Сборка и испытание программы;Тестировщик;1;12;21;21;21;21;0\r\n14;Анализ результатов испытаний;Тестировщик;1;13;22;22;22;22;0\r\n15;Расчёты показателей безопасности жизнедеятельности;Аналитик;1;8;11;11;22;22;11\r\n16;Экономические расчёты;Аналитик;1;14,15;23;23;23;23;0\r\n17;Оформление пояснительной записки;Аналитик;2;16;24;25;24;25;0\r\n"},"data/clients.csv":{"name":"clients.csv","subject":"db","mime":"text/csv","encoding":"text","content":"id,name,segment,city\n1,Анна Орлова,Стандарт,Ростов-на-Дону\n2,Михаил Соколов,Премиум,Краснодар\n3,Елена Волкова,Бизнес,Воронеж\n4,Алексей Миронов,Стандарт,Таганрог\n5,Ирина Белова,Премиум,Волгоград\n6,Павел Крылов,Бизнес,Ростов-на-Дону\n7,Ольга Лебедева,Стандарт,Краснодар\n8,Денис Морозов,Премиум,Воронеж\n9,Мария Кузнецова,Бизнес,Таганрог\n10,Артём Васильев,Стандарт,Волгоград\n11,Наталья Фомина,Премиум,Ростов-на-Дону\n12,Иван Белов,Бизнес,Краснодар\n13,София Романова,Стандарт,Воронеж\n14,Андрей Попов,Премиум,Таганрог\n15,Юлия Сергеева,Бизнес,Волгоград\n16,Анна Орлова · 02,Стандарт,Ростов-на-Дону\n17,Михаил Соколов · 02,Премиум,Краснодар\n18,Елена Волкова · 02,Бизнес,Воронеж\n19,Алексей Миронов · 02,Стандарт,Таганрог\n20,Ирина Белова · 02,Премиум,Волгоград\n21,Павел Крылов · 02,Бизнес,Ростов-на-Дону\n22,Ольга Лебедева · 02,Стандарт,Краснодар\n23,Денис Морозов · 02,Премиум,Воронеж\n24,Мария Кузнецова · 02,Бизнес,Таганрог\n25,Артём Васильев · 02,Стандарт,Волгоград\n26,Наталья Фомина · 02,Премиум,Ростов-на-Дону\n27,Иван Белов · 02,Бизнес,Краснодар\n28,София Романова · 02,Стандарт,Воронеж\n29,Андрей Попов · 02,Премиум,Таганрог\n30,Юлия Сергеева · 02,Бизнес,Волгоград\n31,Анна Орлова · 03,Стандарт,Ростов-на-Дону\n32,Михаил Соколов · 03,Премиум,Краснодар\n33,Елена Волкова · 03,Бизнес,Воронеж\n34,Алексей Миронов · 03,Стандарт,Таганрог\n35,Ирина Белова · 03,Премиум,Волгоград\n36,Павел Крылов · 03,Бизнес,Ростов-на-Дону\n37,Ольга Лебедева · 03,Стандарт,Краснодар\n38,Денис Морозов · 03,Премиум,Воронеж\n3
