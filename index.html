function db(C){C.innerHTML=`<div class="panel"><div class="row"><h2>Клиентский реестр</h2><span class="pill green" id="dbMode">${server?'SQLite · API':'Локальный снимок'}</span></div><p class="muted">Демонстрационный поиск по имени, городу и сегменту. Все данные вымышлены.</p><div class="control-row"><div class="field search"><label for="search">Поиск клиента</label><input id="search" placeholder="Например: Орлова или Ростов"></div><div class="field"><label for="segment">Сегмент</label><select id="segment"><option value="">Все</option><option>Стандарт</option><option>Премиум</option><option>Бизнес</option></select></div></div><div class="row"><small id="count"></small><button class="btn ghost small" id="csv">Экспорт CSV</button></div><div id="clientRows"></div></div><div class="panel"><h3>Связи базы данных</h3><div class="diagram"><div class="branch"><div class="node">clients · 60</div><div class="node">employees · 15</div><div class="node">products · 15</div></div><div class="edge"></div><div class="node orange">requests · 360<br><small>client_id · employee_id · product_id</small></div></div>${notice('При открытии HTML поиск выполняется на встроенном снимке. При запуске backend/server.py — реальный параметризованный запрос к SQLite. Обязательная СУБД по БД пока неизвестна.','info')}</div><div class="panel"><h3>SQL — примеры поиска и связей</h3><pre class="code">${esc(FILES['modules/01-databases/queries.sql'].content)}</pre><button class="btn secondary small" data-file="modules/01-databases/queries.sql">Скачать запросы</button></div>`;let found=[];async function update(){let id=++requestId;const q=$('#search').value.trim(),seg=$('#segment').value;let rows=DATA.clients.filter(c=>(c.name+' '+c.city+' '+c.segment).toLocaleLowerCase('ru').includes(q.toLocaleLowerCase('ru')));if(server){try{const r=await fetch('/api/clients?q='+encodeURIComponent(q));if(!r.ok)throw Error();rows=await r.json()}catch{if($('#dbMode'))$('#dbMode').textContent='Снимок · API недоступен'}}if(id!==requestId||subject!=='db'||!$('#clientRows'))return;found=rows.filter(c=>!seg||c.segment===seg);$('#count').textContent=`Найдено ${found.length} из ${DATA.clients.length}`;$('#clientRows').innerHTML=table(['ID','Клиент','Сегмент','Город'],found.map(c=>[c.id,c.name,c.segment,c.city]));}$('#search').oninput=update;$('#segment').onchange=update;$('#csv').onclick=()=>download('bankflow-clients.csv','\ufeffid;name;segment;city\n'+found.map(c=>[c.id,c.name,c.segment,c.city].join(';')).join('\n'),'text/csv;charset=utf-8');update()}
function vmip(C){C.innerHTML=`<div class="panel"><h2>Вычислительный модуль</h2><p>Калькулятор вклада с ежемесячной капитализацией — дополнительная демонстрация алгоритма, не подтверждённое задание Колесниковой.</p><div class="control-row"><div class="field"><label for="amount">Сумма, ₽</label><input type="number" id="amount" min="0" max="1000000000" value="100000"></div><div class="field"><label for="rate">Годовая ставка, %</label><input type="number" id="rate" min="0" max="100" step=".1" value="12"></div><div class="field"><label for="months">Месяцев</label><input type="number" id="months" min="1" max="120" value="12"></div></div><div id="calcResult"></div><div id="calcTable"></div>${notice('Формула: S = P × (1 + r / 1200)^n. Учебная модель без налогов, пополнений и изменений ставки.','info')}</div><div class="panel"><h3>Python-реализация</h3><pre class="code">${esc(FILES['modules/02-vmip/calculation.py'].content)}</pre><button class="btn secondary" data-file="modules/02-vmip/calculation.py">Скачать код</button></div>`;function calc(){const a=Number($('#amount').value),r=Number($('#rate').value),m=Number($('#months').value);if(!Number.isFinite(a+r+m)||a<0||a>1e9||r<0||r>100||m<1||m>120||!Number.isInteger(m)){$('#calcResult').innerHTML=notice('Введите допустимые параметры.');$('#calcTable').innerHTML='';return}const b=a*(1+r/1200)**m;$('#calcResult').innerHTML=`<div class="result">Итог: ${money(b)} · Доход: ${money(b-a)}</div>`;$('#calcTable').innerHTML=table(['Месяц','Баланс, ₽','Начислено, ₽'],Array.from({length:m},(_,i)=>[i+1,fmt(a*(1+r/1200)**(i+1)),fmt(a*(1+r/1200)**i*r/1200)]))}['amount','rate','months'].forEach(k=>$('#'+k).oninput=calc);calc()}
function iis(C){const raw=DATA.raw, clean=DATA.clean;const cats=[...new Set(clean.map(r=>r.category))];const summary=cats.map(c=>{const a=clean.filter(r=>r.category===c);return [c,Math.round(a.reduce((s,r)=>s+Number(r.hours),0)/a.length*10)/10]});C.innerHTML=`<div class="panel"><div class="row"><h2>ЛР1 · Подготовка датасета</h2><span class="pill green">Python-расчёт выполнен</span></div><p>Синтетические обращения BANKFLOW. В исходных данных специально внесены пропуск, неверные значения, несогласованная категория и дубликат.</p>${metrics([['Строк до',raw.length],['После очистки',clean.length,1],['Признаков',9],['Пропусков после',clean.filter(r=>r.hours===null).length]])}<div class="row"><h3>Среднее время обработки по категориям</h3><span class="pill">Часы</span></div>${bar(summary,' ч')}<div class="control-row"><div class="field"><label for="datasetMode">Набор данных</label><select id="datasetMode"><option value="clean">После очистки</option><option value="raw">Исходный</option></select></div><button class="btn secondary" id="csvAI">Скачать CSV</button></div><div id="dataset"></div></div><div class="panel"><h3>Что сделано в Python</h3><p>Дубликат удалён, категория нормализована, значения за пределами 0–72 ч признаны неверными и заменены медианой вместе с пропуском. Проверены уникальность ID и допустимый диапазон.</p><button class="btn" data-file="modules/03-iis/BANKFLOW_LR1.ipynb">Notebook для Colab ↓</button> <button class="btn secondary" data-file="modules/03-iis/analysis-results.txt">Результаты Python</button>${notice('Датасет необходимо согласовать с преподавателем и убедиться, что его не выбрал другой студент. Графики и расчёт — реальные результаты анализа синтетической выборки; скриншоты из Colab нужно получить при запуске.')}</div><div class="panel"><h3>Визуализация распределения</h3><img class="imgchart" src="data:image/png;base64,${FILES['modules/03-iis/hours_hist.png'].content}" alt="Гистограмма времени обработки из Python"><img class="imgchart" src="data:image/png;base64,${FILES['modules/03-iis/status_hours.png'].content}" alt="Среднее время по статусу из Python"></div>`;function update(){const d=$('#datasetMode').value==='raw'?raw:clean;$('#dataset').innerHTML=table(['ID','Категория','Дата','Часы','Статус'],d.slice(0,20).map(r=>[r.id,r.category,r.date,r.hours??'Пропуск',r.status]));$('#csvAI').onclick=()=>dlFile($('#datasetMode').value==='raw'?'data/requests_raw.csv':'modules/03-iis/requests_clean.csv')}$('#datasetMode').onchange=update;update()}
function isit(C){const s=SUBJECTS.find(s=>s.id==='isit');if(lab>=4)lab=0;C.innerHTML=`<div class="panel"><h2>MySQL · лабораторный стенд</h2>${selector(s,s.labs.map(l=>'ЛР / '+l[0]+' — '+l[1]))}<div id="isitLab"></div></div>`;bindSelector();const A=$('#isitLab');if(lab===0){A.innerHTML=`<h3>ЛР1 — модель прав доступа</h3><p>Выберите роль, чтобы показать операции. Это визуальная модель GRANT/REVOKE, не реальное выполнение MySQL.</p><div class="control-row"><div class="field"><label for="role">Пользователь</label><select id="role"><option value="reader">bf_reader</option><option value="operator">RenamedUser</option></select></div><button class="btn secondary" id="grantToggle">Отозвать права</button></div><div id="rights"></div><pre class="code">${esc(FILES['modules/04-isit/lab01_access.sql'].content)}</pre><button class="btn" data-file="modules/04-isit/lab01_access.sql">Скачать SQL ЛР1</button>`;let revoked=false;function upd(){const r=$('#role').value;$('#rights').innerHTML=table(['Операция','Доступ'],['SELECT','INSERT','UPDATE','DELETE','CREATE','DROP'].map(x=>[x,!revoked&&(r==='reader'||x!=='INSERT')?'Разрешено':'Запрещено']));$('#grantToggle').textContent=revoked?'Восстановить права':'Отозвать права'}$('#role').onchange=()=>{revoked=false;upd()};$('#grantToggle').onclick=()=>{revoked=!revoked;upd()};upd()}else if(lab===1){A.innerHTML=`<h3>ЛР2 — таблица сотрудников</h3><p>Структура: имя, фамилия, возраст, должность, стаж, зарплата. Нажмите, чтобы продемонстрировать UPDATE (изменение только в текущем сеансе).</p><button class="btn" id="updateEmployee">Изменить должность и зарплату</button><div id="emp"></div><pre class="code">${esc(FILES['modules/04-isit/lab02_employees.sql'].content)}</pre><button class="btn secondary" data-file="modules/04-isit/lab02_employees.sql">Скачать SQL ЛР2</button>`;let e=DATA.employees.map(r=>({...r}));function upd(){$('#emp').innerHTML=table(['Имя','Возраст','Должность','Стаж','Зарплата'],e.map(r=>[r.name,r.age,r.role,r.experience,money(r.salary)]))}$('#updateEmployee').onclick=()=>{e[0].role='Старший менеджер';e[0].salary=72000;e[2].role='Старший менеджер';e[2].salary=72000;upd()};upd()}else if(lab===2){A.innerHTML=`<h3>ЛР3 — SELECT / WHERE / LIKE / GROUP BY</h3><div class="control-row"><div class="field"><label for="queryChoice">Запрос</label><select id="queryChoice"><option value="0">SELECT — первые 20 клиентов</option><option value="1">WHERE — зарплата ≥ 65 000</option><option value="2">LIKE — имя начинается на Анна</option><option value="3">GROUP BY — клиенты по городу</option><option value="4">JOIN — обращения и клиенты</option></select></div></div><pre class="code" id="querySQL"></pre><div id="queryResult"></div><button class="btn secondary" data-file="modules/04-isit/lab03_queries.sql">Скачать все 19 SQL-заданий</button>${notice('Результаты здесь вычисляет JavaScript на том же снимке данных. Все 19 пунктов ЛР3 есть в SQL-файле. Для сдачи нужен реальный запуск MySQL.')}`;function upd(){const c=+$('#queryChoice').value;const q=['SELECT * FROM clients LIMIT 20;','SELECT * FROM employees WHERE salary >= 65000;','SELECT * FROM clients WHERE name LIKE \'Анна%\';','SELECT city, COUNT(*) AS n FROM clients GROUP BY city HAVING COUNT(*) >= 5;','SELECT r.id,c.name,r.status FROM requests r JOIN clients c ON c.id=r.client_id LIMIT 20;'];$('#querySQL').textContent=q[c];let h,rows;if(c===0||c===2){h=['ID','Имя','Город'];rows=(c===0?DATA.clients.slice(0,20):DATA.clients.filter(r=>r.name.startsWith('Анна'))).map(r=>[r.id,r.name,r.city])}else if(c===1){h=['Имя','Зарплата'];rows=DATA.employees.filter(r=>r.salary>=65000).map(r=>[r.name,money(r.salary)])}else if(c===3){h=['Город','Количество'];rows=[...new Set(DATA.clients.map(r=>r.city))].map(x=>[x,DATA.clients.filter(r=>r.city===x).length])}else{h=['Обращение','Клиент','Статус'];rows=DATA.requests.slice(0,20).map(r=>[r.id,DATA.clients.find(c=>c.id===r.client_id).name,r.status])}$('#queryResult').innerHTML=table(h,rows)}$('#queryChoice').onchange=upd;upd()}else{A.innerHTML=`<h3>Контрольная №1 — пример «Банк»</h3>${metrics([['Клиенты',60],['Сотрудники',15],['Продукты',15],['Обращения',360]])}<p>В каждой из четырёх связанных таблиц не менее 15 записей. Доступны MySQL-схема и тестовые данные.</p><button class="btn" data-file="modules/04-isit/mysql_bankflow.sql">Скачать MySQL базу ↓</button>${notice('Тема «Банк» — вариант 1. Твой вариант определяется последней цифрой зачётки, а не номером в списке. Контрольная не готова к сдаче без подтверждения варианта, запросов и печатного отчёта.')}`}}
function design(C){if(lab>=3)lab=0;const s=SUBJECTS.find(s=>s.id==='design');C.innerHTML=`<div class="panel"><h2>Проектная документация</h2>${selector(s,s.labs.map(l=>'ЛР'+l[0]+' — '+l[1]))}<div id="designLab"></div><div class="row" style="margin-top:15px"><button class="btn" data-file="modules/05-design/project.md">Единый документ ↓</button><button class="btn secondary" id="designPrint">Печать</button></div></div>`;bindSelector();$('#designPrint').onclick=()=>window.print();const A=$('#designLab');if(lab===0){A.innerHTML=`<h3>ЛР1 — предметная область и аналоги</h3><p>Вымышленное подразделение принимает обращения по банковским продуктам. Цель — общий реестр, поиск, контроль статуса и нагрузки сотрудников. Система не выполняет реальные банковские операции.</p>${table(['Критерий','Jira Service Management','GLPI','Zammad','BANKFLOW'],[['Приём заявок','Портал, email','Инцидент / запрос','Helpdesk','Форма'],['Распределение','Очереди','Группы','Команды','Исполнитель'],['Процесс','Workflow / SLA','Статус, приоритет','История, чек-листы','Статусы'],['Аналитика','Отчёты','Dashboard','Уточнить редакцию','Графики'],['Назначение','ITSM','ITSM / активы','Helpdesk','Учебный банк']])}<p class="muted">Источники: <a href="https://support.atlassian.com/jira-service-management-cloud/docs/get-to-know-the-main-jira-service-management-features/" target="_blank" rel="noreferrer">Jira</a> · <a href="https://www.glpi-project.org/en/features/" target="_blank" rel="noreferrer">GLPI</a> · <a href="https://zammad.com/en/product/features" target="_blank" rel="noreferrer">Zammad</a>.</p>${notice('Сравнение основано на документации, не на собственном тестировании. Добавить реальные скриншоты трёх аналогов и согласовать тему.')}`}else if(lab===1){A.innerHTML=`<h3>ЛР2 — структура и подсистемы</h3><div class="diagram"><div class="node orange">Руководитель подразделения</div><div class="edge"></div><div class="branch"><div class="node">Менеджеры<br>Приём обращений</div><div class="node">Специалисты<br>Обработка</div><div class="node">IT-администратор<br>Поддержка</div></div></div>${table(['Уровень','Функции','Результат'],[['Оперативный','Поиск, регистрация','Карточка, статус'],['Тактический','Назначение, контроль','Очередь, нагрузка'],['Стратегический','Аналитика, решение','Отчёт руководителю']])}<h3>Обеспечивающие подсистемы</h3><div class="diagram"><div class="node orange">BANKFLOW</div><div class="edge"></div><div class="branch">${['Информационная','Программная','Техническая','Организационная','Правовая','Методическая'].map(x=>`<div class="node">${x}</div>`).join('')}</div></div>`}else{A.innerHTML=`<h3>ЛР3 — техническое задание</h3>${table(['Раздел','Содержание'],[['2.1','Общие сведения, название и роли'],['2.2','Цели, назначение'],['2.3','Объект автоматизации'],['2.4','Требования: поиск, данные, интерфейс'],['2.5','Состав работ'],['2.6','Контроль и приёмка'],['2.7','Подготовка объекта'],['2.8','Документирование'],['2.9','Источники']])}<p>Полный черновик по всем трём работам находится в едином документе. Необходима проверка темы и требований оформления.</p>`}}
function serverDemo(C){const s=SUBJECTS.find(s=>s.id==='server');if(lab>=s.labs.length)lab=0;const n=s.labs[lab][0];C.innerHTML=`<div class="panel"><h2>JavaScript и серверы</h2>${selector(s,s.labs.map(l=>'ЛР'+l[0]+' — '+l[1]))}<div id="serverLab"></div><div id="exactTasks"></div><div class="row" style="margin-top:15px"><button class="btn secondary" data-file="modules/06-server/exercises.js">Скачать JS-исходники</button><button class="btn secondary" data-file="modules/06-server/server.js">Скачать Express</button></div>${notice('ЛР1–6: ниже есть 45 основных решений и дополнительное задание. Сверить с преподавателем требования к оформлению, оригинальный приложенный HTML ЛР3 и полный обязательный комплект.')}</div>`;bindSelector();const A=$('#serverLab');let title,desc,inputs,fn,initial;
if(n==='1'){title='Палиндром и площадь треугольника';desc='ЛР1: строки, условия, числа. Два примера из набора.';inputs=[['Текст','А роза упала на лапу Азора'],['Стороны a, b, c','3,4,5']];fn=([v,a])=>{const sides=a.split(',').map(Number);if(sides.length!==3||sides.some(x=>!Number.isFinite(x)))throw Error('Введите три числа');return `Палиндром: ${palindrome(v)?'да':'нет'} · Площадь: ${fmt(triangle(...sides))}`};}
else if(n==='2'){title='Простые числа и сортировка';desc='ЛР2: массивы, делимость и сортировка чисел.';inputs=[['Верхняя граница (2–500)','30'],['Числа через запятую','5,1,9,3,2']];fn=([x,a])=>{const m=Number(x),v=a.split(',').map(Number);if(!Number.isInteger(m)||m<2||m>500||v.some(x=>!Number.isFinite(x)))throw Error('Некорректные данные');return `Простые: ${primes(m).join(', ')} | Сортировка: ${v.sort((a,b)=>a-b).join(', ')}`};}
else if(n==='3'){title='Бисекция и двоичное число';desc='ЛР3: численные функции и сценарии HTML. Для f(x)=x²−cos(x) на [0,1].';inputs=[['Двоичное число','110011'],['Погрешность','0.001']];fn=([v,e])=>{if(!/^[01]{1,30}$/.test(v)||Number(e)<=0||!Number.isFinite(Number(e)))throw Error('Введите двоичное число и положительную погрешность');return `Десятичное: ${parseInt(v,2)} | Корень: ${bisect(x=>x*x-Math.cos(x),0,1,+e).toFixed(6)}`};}
else if(n==='4'){title='Объекты и глубокое копирование';desc='ЛР4: создаём копию объекта и меняем вложенное свойство независимо от оригинала.';inputs=[['Имя клиента','Анна'],['Новый город копии','Краснодар']];fn=([v,c])=>{let o={name:v,profile:{city:'Ростов-на-Дону'}};let copy=deepCopy(o);copy.profile.city=c;return JSON.stringify({original:o,copy},null,2)};}

e"></div><div class="node">Тестирование · 2</div><div class="edge"></div><div class="node">Документация · 2</div></div><div class="result">Критические пути: 13 дней (две параллельные ветви)</div>`}else if(lab===3){A.innerHTML=`<h3>ЛР1.4 — техническое задание</h3><p>Назначение, требования, этапы разработки и приёмка описаны в черновике проектирования. Нужно адаптировать под отдельную методичку Каныгина и вариант.</p><button class="btn secondary" data-file="modules/05-design/project.md">Открыть ТЗ</button>`}else if(lab<7){A.innerHTML=`<h3>ЛР${esc(s.labs[lab][0])} — ${esc(s.labs[lab][1])}</h3><p>Методика оценки надёжности предусмотрена пособием. Исходные данные и назначенный вариант ещё не установлены.</p>${notice('Расчёт по модели не выполнен. Ниже — отдельный тестовый чек-лист приложения, не замена расчёту.')} ${table(['Проверка','Ожидаемый результат'],[['Поиск клиента','Список совпадений'],['Связи SQLite','Нет нарушений внешних ключей'],['Датасет','360 уникальных строк, 0 пропусков'],['Локальная страница','7 разделов работают без сети']])}`}else{A.innerHTML=`<h3>ЛР3 — стандарты</h3>${table(['Стандарт','Предлагаемое применение'],[['ГОСТ 19.201-78','Техническое задание на программу'],['ГОСТ 19.301-79','Программа и методика испытаний'],['ГОСТ 34.602-2020','ТЗ на автоматизированную систему']])}${notice('Это перечень для сверки, а не заявление о соответствии. Требуемые стандарты и объём оформления уточнить по методичке.')}`}}
