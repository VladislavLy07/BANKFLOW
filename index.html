чебная система без авторизации.\n- `sw.js` генерируется при сборке: статический кэш по хэшу HTML, API исключён. GitHub Pages — браузерные данные localStorage, не серверная БД. Режимы хранения явно разделены.\n- Аналитика ИИС остаётся на неизменяемом учебном наборе, новые обращения не меняют результаты ЛР1.\n- Сборка использует пути POSIX и UTF-8, не пишет за пределы проекта; `src/build.py` собирает автономный HTML и комплекты.\n"},"docs/AUDIT.md":{"name":"AUDIT.md","subject":"all","mime":"text/markdown","encoding":"text","content":"# Проверка 8 дисциплин\n1 БД: письмо Блиновской 23.10, точные ЛР и курсовая не установлены; чужие файлы ПИС и ИСиТ не считать БД.\n2 ВМИП: полное название Высокоуровневые методы информатики и программирования; конкретные задания не найдены.\n3 ИИС: ЛР1 Python/Colab, уникальный датасет; дальнейшие работы неизвестны.\n4 ИСиТ: ЛР1–3, КР1 (вариант по последней цифре зачётки). Архив опубликован в теме БД, относится к ИСиТ.\n5 ПИС: ЛР1–3, единый документ; дубли ранних файлов относятся к ПИС.\n6 СИТ: ЛР1–6, материалы 8–10; №7 не найден, 45 основных пунктов в 1–6.\n7 Стандартизация: методичка 2026, 8 разделов; вариант и полный объём уточнить.\n8 ОФП/СМГ: требования и преподаватель неизвестны; отдельный реестр, не программный раздел.\nИсточники: сохранённые результаты учебной разведки 07–08.11, не новая проверка Telegram; восемь тематических чатов целиком не доступны. Назначение преподавателей по прежней сводке.\n\n## Повторная сверка v1.1\nПИС: в оргструктуре до внедрения не должно быть будущей ИС/IT-отдела; функциональные подсистемы оформляются тремя отдельными таблицами, обеспечивающие — восемью видами. Исправлено в `modules/05-design/project.md`, добавлены SVG. Скриншоты трёх аналогов и рамки/штампы ещё не оформлены.\nСтандартизация: таблица 1.4 требует 17 этапов, а не 7. Добавлены календарный график, оперограмма, CPM и CSV. BANKFLOW не входит в перечень 16 вариантов; назначенный вариант не подтверждён.\nОстальные неизвестные из исходного аудита не считаются закрытыми.\n"},"backend/server.py":{"name":"server.py","subject":"db","mime":"text/x-python","encoding":"text","content":"\"\"\"BANKFLOW local educational server. Python 3.10+, standard library only.\nNo authentication: loopback by default; trust only your own LAN for --host 0.0.0.0.\n\"\"\"\nfrom http.server import ThreadingHTTPServer, BaseHTTPRequestHandler\nfrom urllib.parse import urlparse, parse_qs\nfrom pathlib import Path\nfrom datetime import date\nfrom contextlib import contextmanager\nimport sqlite3, json, argparse\nROOT=Path(__file__).resolve().parents[1]\nDB=ROOT/'data/bankflow.sqlite3'\nSTATUSES={'Новое','В работе','Закрыто'}\nPRIORITIES={'Обычный','Высокий'}\n@contextmanager\ndef connect():\n    c=sqlite3.connect(DB,timeout=10)\n    c.row_factory=sqlite3.Row\n    c.execute('PRAGMA foreign_keys=ON')\n    try:\n        with c: yield c\n    finally: c.close()\ndef init_db():\n    if not DB.exists():\n        try:\n            with connect() as c:\n                c.executescript('BEGIN;\\n'+(ROOT/'database/schema.sql').read_text(encoding='utf-8')+'\\n'+(ROOT/'database/seed.sql').read_text(encoding='utf-8')+'\\nCOMMIT;')\n        except Exception:\n            DB.unlink(missing_ok=True)\n            raise\ndef get_clients(q=''):\n    with connect() as c:\n        c.create_function('casefold',1,lambda s:s.casefold() if s else '')\n        return [dict(r) for r in c.execute(\"SELECT * FROM clients WHERE instr(casefold(name || ' ' || city || ' ' || segment),?)>0 ORDER BY id\",(q.casefold(),))]\ndef get_requests():\n    with connect() as c:\n        return [dict(r) for r in c.execute('SELECT * FROM requests ORDER BY id DESC')]\ndef create_request(data):\n    required=['client_id','employee_id','product_id']\n    if not isinstance(data,dict) or any(type(data.get(k)) is not int or data[k]<=0 for k in required) or data.get('priority') not in PRIORITIES:\n        raise ValueError('Invalid client, employee, product, or priority')\n    with connect() as c:\n        product=c.execute('SELECT category FROM products WHERE id=?',(data['product_id'],)).fetchone()\n        if not product: raise ValueError('Unknown product')\n        for table,key in [('clients','client_id'),('employees','employee_id')]:\n            if not c.execute('SELECT 1 FROM '+table+' WHERE id=?',(data[key],)).fetchone():raise ValueError('Unknown '+key)\n        cur=c.execute('INSERT INTO requests(client_id,employee_id,product_id,category,date,hours,status,priority) VALUES (?,?,?,?,?,?,?,?)', (data['client_id'],data['employee_id'],data['product_id'],product['category'],date.today().isoformat(),0,'Новое',data['priority']))\n        return dict(c.execute('SELECT * FROM requests WHERE id=?',(cur.lastrowid,)).fetchone())\ndef update_request(id,data):\n    if not isinstance(data,dict) or data.get('status') not in STATUSES:raise ValueError('Invalid status')\n    with connect() as c:\n        cur=c.execute('UPDATE requests SET status=? WHERE id=?',(data['status'],id))\n        if not cur.rowcount:raise LookupError('Unknown request')\n        return dict(c.execute('SELECT * FROM requests WHERE id=?',(id,)).fetchone())\nSTATIC={'/':'index.html','/index.html':'index.html','/manifest.webmanifest':'manifest.webmanifest','/icon.svg':'icon.svg','/icon-192.png':'icon-192.png','/icon-512.png':'icon-512.png','/sw.js':'sw.js'}\nMIME={'.html':'text/html; charset=utf-8','.webmanifest':'application/manifest+json','.svg':'image/svg+xml','.png':'image/png','.js':'text/javascript; charset=utf-8'}\nclass Handler(BaseHTTPRequestHandler):\n    def send(self,body,typ,code=200):\n        if isinstance(body,str):body=body.encode('utf-8')\n        self.send_response(code);self.send_header('Content-Type',typ);self.send_header('Content-Length',str(len(body)));self.send_header('Cache-Control','no-store');self.send_header('X-Content-Type-Options','nosniff');self.end_headers();self.wfile.write(body)\n    def json(self,data,code=200):self.send(json.dumps(data,ensure_ascii=False),'application/json; charset=utf-8',code)\n    def do_GET(self):\n        p=urlparse(self.path)\n        try:\n            if p.path in STATIC:\n                f=ROOT/STATIC[p.path]\n                if f.is_file():self.send(f.read_bytes(),MIME[f.suffix]);return\n            elif p.path=='/api/health':self.json({'status':'ok','database':'SQLite','version':'1.1'});return\n            elif p.path=='/api/clients':self.json(get_clients(parse_qs(p.query).get('q',[''])[0]));return\n            elif p.path=='/api/requests':self.json(get_requests());return\n            self.json({'error':'Not found'},404)\n        except (OSError,sqlite3.Error):self.json({'error':'Local server error'},500)\n    def read_json(self):\n        if self.headers.get('Content-Type','').split(';')[0].strip()!='application/json':raise ValueError('JSON required')\n        n=int(self.headers.get('Content-Length','0'))\n        if not 0<n<=4096:raise ValueError('Invalid body length')\n        return json.loads(self.rfile.read(n))\n    def write_allowed(self):\n        # Block cross-origin browser writes. No CORS permissions are granted.\n        origin=self.headers.get('Origin')\n        if origin and urlparse(origin).netloc!=self.headers.get('Host'):raise ValueError('Cross-origin write rejected')\n    def do_POST(self):\n        if urlparse(self.path).path!='/api/requests':self.json({'error':'Not found'},404);return\n        self.mutate(lambda: (create_request(self.read_json()),201))\n    def do_PATCH(self):\n        p=urlparse(self.path).path.split('/')\n        if len(p)!=4 or p[1:3]!=['api','requests'] or not p[3].isdigit():self.json({'error':'Not found'},404);return\n        self.mutate(lambda: (update_request(int(p[3]),self.read_json()),200))\n    def mutate(self,action):\n        try:\n            self.write_allowed();result,code=action();self.json(result,code)\n        except (ValueError,TypeError,UnicodeError,sqlite3.IntegrityError):self.json({'error':'Invalid request data'},400)\n        except LookupError:self.json({'error':'Request not found'},404)\n        except sqlite3.Error:self.json({'error':'Local database error'},500)\nif __name__=='__main__':\n    ap=argparse.ArgumentParser();ap.add_argument('--host',default='127.0.0.1');ap.add_argument('--port',type=int,default=8000);ap.add_argument('--db',type=Path,default=DB,help='Optional separate SQLite file for testing');a=ap.parse_args();DB=a.db.resolve();init_db();print(f'BANKFLOW: http://{a.host}:{a.port}');ThreadingHTTPServer((a.host,a.port),Handler).serve_forever()\n"},"exports/01-databases.zip":{"name":"01-databases.zip","subject":"db","mime":"application/zip","encoding":"base64","content":"UEsDBBQAAAAIAAAAIVwdLYXAzAkAALoYAAARAAAAYmFja2VuZC9zZXJ2ZXIucHmdGc1y27j5rqdA3APIGqakJNvuymFT/yiJWttyJWW3HVXDgUhIYkQRNAHG1mQ9s+2lh7310lP7DN3OdKbdmeYZnDfqB4CkSEtxMmtPLAH48P3/Int7e8dHF799cdb/BkXcpxFiQeZTGfIYvguWvmWpgy7XcsFj9MRpt/YJEpLGAU0DFIXTlKZrxONo7TQuOKKZXLBYhgZBBzDyZEr9JZquUcBmNIvkIZJpJqS+g9Y8SxG/jtHZ0QWa8RQdHCw4HLYc89vY29trzFK+QgspE8ewg8JVwlOJRouU0SCM569Go8uhPiLomAqm1gN2lTEhXwGnEUsNjiyNgGMnoalgBRLY02uC9Id3JQxsQuUCgAuwS1iag4BKJsNViUCtzYnPY8luZOVWvrOiMZ0DE/muuIpCyZ4Q9EbwmCCazjXpxqDfH7mKkOV5szBinmc7KRM8esssW3ENmhXj9qRxeuwq2CYG2rQ5pfFyFvFrJ8eLG8PR0ej1sDt03+G7v9+9v/sX/Ps3Jvjur+jDd3f/vPvh7v2HP5udv8Hyxw/fffgeNt7j28bloNcf9EY9c/kfdz/AyV/u/vfh+7v/agSw/BNg+/HuP7Bx2/j1PQnBxkromPnSsjsNBD++m/PlFAenx0QpkGfSbbdsA+Sk/NqbUV/ydF1eGPDr/JTdMD+TzMKXg6OX50fKVVg4j70lWwu3f4ENFpmuDU31cx3KBfI7aB2yKEC+3p+F4NTRugMY/YgLUKvmOIxD6QXTguNwhmIu0ekxkA2FFMX+FokNmUJkRAXQrAHUBBB+GibSwsfdl72Lwz/GeN/aWHIKrtsU/oKtqLIlVtangaf0a7HY58rVXZzJ2cGX2N7HO28zFnze3ZP++XlvdJhrTv2wG58lEnX1h4remhigjSyOwnhprUIhAJvHl+4ozZhdA0tpCJ6slDpn0vOjUPmsdeVinCvxQX2BWYBtybxZFvuKBwv7INaMRwEmbRLR1TSgSHSEU2wDCjCXQCyCkMYVaVImszRG4yAEOqmtkwtkjrjiTHvD7ln3ZIR+jl4M+ucoZxZ986o76AKkkKlVkokpRPy33yIMv/Dhh3JdWQo2X8Fdmzy3f9VC/cFpd4CO/4DCYI9YVxVeiW1PSuWkJkOV7vWgZj5DHFwXp0BfZQeddocnOOchV3UOZykfyjlRW2HKAneMjVK8EPSP2SqJ+Joxs0pSDoVCH02qYRMKpToa+0yjJIpjGwG7NF5bcp2YbQc0YC1tsJ4wt2KpYNTReDl55ra0hEslYcGN function palindrome(s){const a=s.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');return a===[...a].reverse().join('');}
function triangle(a,b,c){if(Math.min(a,b,c)<=0||a+b<=c||a+c<=b||b+c<=a)throw Error('Некорректные стороны');const p=(a+b+c)/2;return Math.sqrt(p*(p-a)*(p-b)*(p-c));}
function primes(n){return Array.from({length:Math.max(0,n-1)},(_,i)=>i+2).filter(x=>{for(let j=2;j*j<=x;j++)if(x%j===0)return false;return true;});}
function bisect(f,a,b,eps=0.001){if(!Number.isFinite(a+b+eps)||eps<=0||a>=b||f(a)*f(b)>0)throw Error('Нет интервала смены знака');if(f(a)===0)return a;if(f(b)===0)return b;for(let i=0;i<100&&(b-a)>eps;i++){const m=(a+b)/2;if(f(m)===0)return m;if(f(a)*f(m)<=0)b=m;else a=m;}return(a+b)/2;}
function deepCopy(o){return JSON.parse(JSON.stringify(o));}
class Calculator{constructor(x=0){this.x=x;} add(y){this.x+=y;return this;} multiply(y){this.x*=y;return this;}}
function anagram(a,b){const f=s=>[...s.toLowerCase().replace(/\s/g,'')].sort().join('');return f(a)===f(b);}
function pairSum(a,t){const seen=new Set();for(const n of a){if(seen.has(t-n))return [t-n,n];seen.add(n);}return null;}
const exercises={palindrome,triangle,primes,bisect,deepCopy,Calculator,anagram,pairSum};

function audit(){return `<div class="module-header"><div class="eyebrow">Контроль качества</div><h1>План сдачи и сверка</h1><p>Состояние по сохранённым материалам 7–8 ноября. Не утверждённый график сессии.</p></div><div class="panel" style="margin-top:14px"><h3>8 дисциплин</h3>${table(['Предмет','Форма','Что известно','Следующий шаг'],[...SUBJECTS.map(s=>[s.short,s.form,s.status,s.next]),['ОФП/СМГ','Зачёт','Требования не найдены','Уточнить группу, преподавателя, нормативы и посещаемость.']])}${notice('Физическая культура исключена из программных разделов, но не из учебного плана. Точный перечень работ и даты сдачи необходимо подтвердить.')}</div><div class="panel"><h2>Готовность каждой работы</h2><p class="muted">Отмечай статус вручную после выполнения и сдачи. Состояние сохраняется в браузере; для другого устройства используй экспорт и импорт.</p><div class="row"><button class="btn ghost small" id="exportProgress">Экспорт JSON</button><label class="import-label">Импорт JSON <input id="importProgress" type="file" accept="application/json,.json"></label></div><p id="progressMessage" role="status" class="muted"></p>${progressRows()}</div><div class="panel"><h3>Перед сдачей</h3><p>Отметки хранятся в этом браузере, если доступно локальное хранилище. Это личный чек-лист, не отметки преподавателя.</p><div class="checklist">${['Открыть оригинальные задания по БД и ВМИП','Подтвердить вариант ИСиТ и стандартизации','Согласовать тему ПИС и датасет ИИС','Запустить требуемые среды и сделать реальные скриншоты','Сверить все пункты ЛР и оформить отчёты','Проверить офлайн-версию на планшете'].map((x,i)=>`<label><input type="checkbox" data-check="${i}">${esc(x)}</label>`).join('')}</div></div><div class="panel"><h3>Аудит источников</h3><div class="doc">${esc(FILES['docs/AUDIT.md'].content)}</div></div>${footer()}`}
function modulePage(s){const idx=SUBJECTS.indexOf(s);return `<div class="module-header"><div class="row"><div class="eyebrow">Модуль 0${idx+1} / 07 · ${esc(s.form)}</div><span class="pill orange">${esc(s.status)}</span></div><h1>${esc(s.title)}</h1><small>${esc(s.teacher)}</small><p>${esc(s.lead)}</p></div><div class="tabs">${[['demo','Демонстрация'],['labs','Лабораторные'],['code','Исходники'],['deliver','Для преподавателя']].map(([k,n])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${n}</button>`).join('')}</div><div id="content"></div>${footer()}`}
function render(){nav();const main=$('#main');$('#breadcrumb').textContent='Рабочее пространство / '+(subject==='workspace'?'Обращения':subject==='audit'?'План сдачи':SUBJECTS.find(s=>s.id===subject)?.short||'Обзор');if(subject==='workspace'){workspace();return}main.innerHTML=subject==='audit'?audit():!subject?home():modulePage(SUBJECTS.find(s=>s.id===subject));main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setRoute(b.dataset.go));main.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;syncRoute();render()});bindProgress();if(subject==='audit'){main.querySelectorAll('[data-check]').forEach(x=>{try{x.checked=localStorage.getItem('bf-check-'+x.dataset.check)==='1'}catch{};x.onchange=()=>{try{localStorage.setItem('bf-check-'+x.dataset.check,x.checked?'1':'0')}catch{}}})}else if(subject){const s=SUBJECTS.find(x=>x.id===subject);if(tab==='demo')demo(s);else if(tab==='labs')labs(s);else if(tab==='code')code(s);else deliver(s)}}
function labs(s){$('#content').innerHTML=`<div class="panel"><div class="row"><h2>Карта лабораторных</h2><span class="pill">${s.labs.length} позиций в реестре</span></div>${s.labs.map((l,i)=>`<div class="lab-card"><span class="lab-num">${esc(l[0])}</span><div><h3>${esc(l[1])}</h3><p>${esc(l[2])}</p><button class="btn ghost small" data-lab="${i}">Открыть демонстрацию →</button></div></div>`).join('')}${notice('Это карта найденных материалов и демо; полный обязательный комплект не подтверждён. Не все пункты реализованы.')}</div><div class="panel"><h3>Источник</h3><p>${esc(s.source)}</p>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">Исходное сообщение Telegram ↗</a>`:''}<p class="muted">${esc(s.next)}</p></div>`;$('#content').querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>{lab=+b.dataset.lab;tab='demo';syncRoute();render()})}
function code(s){const f=filesFor(s);$('#content').innerHTML=`<div class="panel"><h2>Исходный код и файлы</h2><p class="muted">Скачивание работает из автономной страницы. Код настоящих сред запускается по README.</p>${f.map(k=>`<div class="file-row"><span>${esc(FILES[k].name)}<br><small>${esc(k)}</small></span><button class="btn ghost small" data-preview="${esc(k)}" ${FILES[k].encoding==='base64'?'disabled':''}>Смотреть</button><button class="btn secondary small" data-file="${esc(k)}">Скачать</button></div>`).join('')}<div id="preview"></div></div>`;bindFiles();$('#content').querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{const f=FILES[b.dataset.preview];$('#preview').innerHTML=`<h3 style="margin-top:15px">${esc(f.name)}</h3><pre class="code">${esc(f.content)}</pre>`;$('#preview').scrollIntoView({behavior:'smooth',block:'nearest'})})}
function bindFiles(){document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>dlFile(b.dataset.file))}
function deliver(s){let k=Object.keys(FILES).find(k=>k.startsWith('exports/'+s.folder+'.zip'));$('#content').innerHTML=`<div class="panel"><div class="eyebrow">Комплект преподавателя</div><h2>${esc(s.short)}</h2><p>${esc(s.teacher)} · ${esc(s.form)}</p>${notice('Комплект содержит реально созданные материалы и явный список незавершённых требований. Это не подтверждение сдачи.')}${k?`<button class="btn" data-file="${k}">Скачать комплект ZIP ↓</button>`:''} <button class="btn secondary" id="printModule">Печать страницы</button></div><div class="panel"><h3>Перед передачей</h3><p>${esc(s.next)}</p><p><b>Источник:</b> ${esc(s.source)}</p><h3 style="margin-top:17px">Что внутри</h3>${filesFor(s).filter(k=>!k.startsWith('exports/')).map(k=>`<div class="file-row"><span>${esc(FILES[k].name)}</span><button class="btn ghost small" data-file="${esc(k)}">Скачать</button></div>`).join('')}</div>`;bindFiles();$('#printModule').onclick=()=>window.print()}
function demo(s){const C=$('#content');if(['db','vmip','iis'].includes(s.id)&&lab>0){C.innerHTML=`<div class="panel"><h2>${esc(s.labs[lab]?.[1]||'Уточнить ТЗ')}</h2><p>${esc(s.labs[lab]?.[2]||s.next)}</p>${notice(s.next)}<button class="btn" id="backDemo">К рабочей демонстрации</button></div>`;$('#backDemo').onclick=()=>{lab=0;syncRoute();demo(s)};return;}if(s.id==='db')db(C);else if(s.id==='vmip')vmip(C);else if(s.id==='iis')iis(C);else if(s.id==='isit')isit(C);else if(s.id==='design')design(C);else if(s.id==='server')serverDemo(C);else std(C);bindFiles()}
function selector(s,labels){return `<div class="control-row"><div class="field"><label for="labSelect">Работа / демонстрация</label><select id="labSelect">${labels.map((n,i)=>`<option value="${i}" ${lab===i?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div>`}
function bindSelector(){const e=$('#labSelect');if(e)e.onchange=()=>{lab=+e.value;syncRoute();demo(SUBJECTS.find(s=>s.id===subject))}}
function db(C){C.innerHTML=`<div class="panel"><div class="row"><h2>Клиентский реестр</h2><span class="pill green" id="dbMode">${server?'SQLite · API':'Локальный снимок'}</span></div><p class="muted">Демонстрационный поиск по имени, городу и сегменту. Все данные вымышлены.</p><div class="control-row"><div class="field search"><label for="search">Поиск клиента</label><input id="search" placeholder="Например: Орлова или Ростов"></div><div class="field"><label for="segment">Сегмент</label><select id="segment"><option value="">Все</option><option>Стандарт</option><option>Премиум</option><option>Бизнес</option></select></div></div><div class="row"><small id="count"></small><button class="btn ghost small" id="csv">Экспорт CSV</button></div><div id="clientRows"></div></div><div class="panel"><h3>Связи базы данных</h3><div class="diagram"><div class="branch"><div class="node">clients · 60</div><div class="node">employees · 15</div><div class="node">products · 15</div></div><div class="edge"></div><div class="node orange">requests · 360<br><small>client_id · employee_id · product_id</small></div></div>${notice('При открытии HTML поиск выполняется на встроенном снимке. При запуске backend/server.py — реальный параметризованный запрос к SQLite. Обязательная СУБД по БД пока неизвестна.','info')}</div><div class="panel"><h3>SQL — примеры поиска и связей</h3><pre class="code">${esc(FILES['modules/01-databases/queries.sql'].content)}</pre><button class="btn secondary small" data-file="modules/01-databases/queries.sql">Скачать запросы</button></div>`;let found=[];async function update(){let id=++requestId;const q=$('#search').value.trim(),seg=$('#segment').value;let rows=DATA.clients.filter(c=>(c.name+' '+c.city+' '+c.segment).toLocaleLowerCase('ru').includes(q.toLocaleLowerCase('ru')));if(server){try{const r=await fetch('/api/clients?q='+encodeURIComponent(q));if(!r.ok)throw Error();rows=await r.json()}catch{if($('#dbMode'))$('#dbMode').textContent='Снимок · API недоступен'}}if(id!==requestId||subject!=='db'||!$('#clientRows'))return;found=rows.filter(c=>!seg||c.segment===seg);$('#count').textContent=`Найдено ${found.length} из ${DATA.clients.length}`;$('#clientRows').innerHTML=table(['ID','Клиент','Сегмент','Город'],found.map(c=>[c.id,c.name,c.segment,c.city]));}$('#search').oninput=update;$('#segment').onchange=update;$('#csv').onclick=()=>download('bankflow-clients.csv','\ufeffid;name;segment;city\n'+found.map(c=>[c.id,c.name,c.segment,c.city].join(';')).join('\n'),'text/csv;charset=utf-8');update()}
function vmip(C){C.innerHTML=`<div class="panel"><h2>Вычислительный модуль</h2><p>Калькулятор вклада с ежемесячной капитализацией — дополнительная демонстрация алгоритма, не подтверждённое задание Колесниковой.</p><div class="control-row"><div class="field"><label for="amount">Сумма, ₽</label><input type="number" id="amount" min="0" max="1000000000" value="100000"></div><div class="field"><label for="rate">Годовая ставка, %</label><input type="number" id="rate" min="0" max="100" step=".1" value="12"></div><div class="field"><label for="months">Месяцев</label><input type="number" id="months" min="1" max="120" value="12"></div></div><div id="calcResult"></div><div id="calcTable"></div>${notice('Формула: S = P × (1 + r / 1200)^n. Учебная модель без налогов, пополнений и изменений ставки.','info')}</div><div class="panel"><h3>Python-реализация</h3><pre class="code">${esc(FILES['modules/02-vmip/calculation.py'].content)}</pre><button class="btn secondary" data-file="modules/02-vmip/calculation.py">Скачать код</button></div>`;function calc(){const a=Number($('#amount').value),r=Number($('#rate').value),m=Number($('#months').value);if(!Number.isFinite(a+r+m)||a<0||a>1e9||r<0||r>100||m<1||m>120||!Number.isInteger(m)){$('#calcResult').innerHTML=notice('Введите допустимые параметры.');$('#calcTable').innerHTML='';return}const b=a*(1+r/1200)**m;$('#calcResult').innerHTML=`<div class="result">Итог: ${money(b)} · Доход: ${money(b-a)}</div>`;$('#calcTable').innerHTML=table(['Месяц','Баланс, ₽','Начислено, ₽'],Array.from({length:m},(_,i)=>[i+1,fmt(a*(1+r/1200)**(i+1)),fmt(a*(1+r/1200)**i*r/1200)]))}['amount','rate','months'].forEach(k=>$('#'+k).oninput=calc);calc()}
function iis(C){const raw=DATA.raw, clean=DATA.clean;const cats=[...new Set(clean.map(r=>r.category))];const summary=cats.map(c=>{const a=clean.filter(r=>r.category===c);return [c,Math.round(a.reduce((s,r)=>s+Number(r.hours),0)/a.length*10)/10]});C.innerHTML=`<div class="panel"><div class="row"><h2>ЛР1 · Подготовка датасета</h2><span class="pill green">Python-расчёт выполнен</span></div><p>Синтетические обращения BANKFLOW. В исходных данных специально внесены пропуск, неверные значения, несогласованная категория и дубликат.</p>${metrics([['Строк до',raw.length],['После очистки',clean.length,1],['Признаков',9],['Пропусков после',clean.filter(r=>r.hours===null).length]])}<div class="row"><h3>Среднее время обработки по категориям</h3><span class="pill">Часы</span></div>${bar(summary,' ч')}<div class="control-row"><div class="field"><label for="datasetMode">Набор данных</label><select id="datasetMode"><option value="clean">После очистки</option><option value="raw">Исходный</option></select></div><button class="btn secondary" id="csvAI">Скачать CSV</button></div><div id="dataset"></div></div><div class="panel"><h3>Что сделано в Python</h3><p>Дубликат удалён, категория нормализована, значения за пределами 0–72 ч признаны неверными и заменены медианой вместе с пропуском. Проверены уникальность ID и допустимый диапазон.</p><button class="btn" data-file="modules/03-iis/BANKFLOW_LR1.ipynb">Notebook для Colab ↓</button> <button class="btn secondary" data-file="modules/03-iis/analysis-results.txt">Результаты Python</button>${notice('Датасет необходимо согласовать с преподавателем и убедиться, что его не выбрал другой студент. Графики и расчёт — реальные результаты анализа синтетической выборки; скриншоты из Colab нужно получить при запуске.')}</div><div class="panel"><h3>Визуализация распределения</h3><img class="imgchart" src="data:image/png;base64,${FILES['modules/03-iis/hours_hist.png'].content}" alt="Гистограмма времени обработки из Python"><img class="imgchart" src="data:image/png;base64,${FILES['modules/03-iis/status_hours.png'].content}" alt="Среднее время по статусу из Python"></div>`;function update(){const d=$('#datasetMode').value==='raw'?raw:clean;$('#dataset').innerHTML=table(['ID','Категория','Дата','Часы','Статус'],d.slice(0,20).map(r=>[r.id,r.category,r.date,r.hours??'Пропуск',r.status]));$('#csvAI').onclick=()=>dlFile($('#datasetMode').value==='raw'?'data/requests_raw.csv':'modules/03-iis/requests_clean.csv')}$('#datasetMode').onchange=update;update()}
function isit(C){const s=SUBJECTS.find(s=>s.id==='isit');if(lab>=4)lab=0;C.innerHTML=`<div class="panel"><h2>MySQL · лабораторный стенд</h2>${selector(s,s.labs.map(l=>'ЛР / '+l[0]+' — '+l[1]))}<div id="isitLab"></div></div>`;bindSelector();const A=$('#isitLab');if(lab===0){A.innerHTML=`<h3>ЛР1 — модель прав доступа</h3><p>Выберите роль, чтобы показать операции. Это визуальная модель GRANT/REVOKE, не реальное выполнение MySQL.</p><div class="control-row"><div class="field"><label for="role">Пользователь</label><select id="role"><option value="reader">bf_reader</option><option value="operator">RenamedUser</option></select></div><button class="btn secondary" id="grantToggle">Отозвать права</button></div><div id="rights"></div><pre class="code">${esc(FILES['modules/04-isit/lab01_access.sql'].content)}</pre><button class="btn" data-file="modules/04-isit/lab01_access.sql">Скачать SQL ЛР1</button>`;let revoked=false;function upd(){const r=$('#role').value;$('#rights').innerHTML=table(['Операция','Доступ'],['SELECT','INSERT','UPDATE','DELETE','CREATE','DROP'].map(x=>[x,!revoked&&(r==='reader'||x!=='INSERT')?'Разрешено':'Запрещено']));$('#grantToggle').textContent=revoked?'Восстановить права':'Отозвать права'}$('#role').onchange=()=>{revoked=false;upd()};$('#grantToggle').onclick=()=>{revoked=!revoked;upd()};upd()}else if(lab===1){A.innerHTML=`<h3>ЛР2 — таблица сотрудников</h3><p>Структура: имя, фамилия, возраст, должность, стаж, зарплата. Нажмите, чтобы продемонстрировать UPDATE (изменение только в текущем сеансе).</p><button class="btn" id="updateEmployee">Изменить должность и зарплату</button><div id="emp"></div><pre class="code">${esc(FILES['modules/04-isit/lab02_employees.sql'].content)}</pre><button class="btn secondary" data-file="modules/04-isit/lab02_employees.sql">Скачать SQL ЛР2</button>`;let e=DATA.employees.map(r=>({...r}));function upd(){$('#emp').innerHTML=table(['Имя','Возраст','Должность','Стаж','Зарплата'],e.map(r=>[r.name,r.age,r.role,r.experience,money(r. е применение'],[['ГОСТ 19.201-78','Техническое задание на программу'],['ГОСТ 19.301-79','Программа и методика испытаний'],['ГОСТ 34.602-2020','ТЗ на автоматизированную систему']])}${notice('Это перечень для сверки, а не заявление о соответствии. Требуемые стандарты и объём оформления уточнить по методичке.')}`}}
